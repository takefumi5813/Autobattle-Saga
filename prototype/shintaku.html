<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神託の迷宮</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 神の視点。準備（神殿）と戦場（盤）と帰還（記録）を切り替える一画面ゲーム。盤は上に敵・下に仲間・脇に年代記 */
:root{
  color-scheme: dark;
  --bg:#10121b; --panel:#181b28; --panel2:#1f2336; --line:#2d3249;
  --fg:#e9e3d2; --muted:#9692aa; --gold:#e2bd64; --gold-dim:#7d6a3c;
  --enemy:#d67262; --heal:#76c6a2; --frost:#8fc5ec; --warn:#f2a54e; --bad:#e0605a; --spark:#f3e27a;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.65;
  background-image:radial-gradient(1200px 500px at 50% -200px, #2a2540 0%, transparent 70%);}
.app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.08em}
.brand .mark{color:var(--gold);margin-right:.3em}
.brand small{font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.1em;margin-left:.8em}
.steps{display:flex;gap:6px;font-size:.78rem;color:var(--muted);letter-spacing:.12em}
.steps span{padding:2px 10px;border:1px solid var(--line);border-radius:99px}
.steps span.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
h2{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:.06em;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.06em;margin:0 0 8px;color:var(--gold)}
h4{font-size:.72rem;letter-spacing:.18em;color:var(--muted);font-weight:500;margin:10px 0 4px}
.lead{color:var(--muted);max-width:72ch;margin:0 0 18px}
.sec{margin-bottom:26px}
.muted{color:var(--muted)}
.small{font-size:.8rem}
/* ---------- 準備 ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:420px){.roster{grid-template-columns:minmax(0,1fr)}}
.char{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.char .nm{font-family:var(--f-display);font-size:1.15rem;font-weight:800;letter-spacing:.05em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.char .nm small{font-family:var(--f-body);font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.08em}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;padding:0 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tag.gold{color:var(--gold);border-color:var(--gold-dim)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.char .bio{font-size:.82rem;color:#c9c3b3;margin:0}
.char .wish{font-size:.82rem;color:var(--gold);margin:0;font-family:var(--f-display)}
.meter{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{flex:1}
.bar{height:6px;background:#0c0e15;border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--gold);transition:width .12s linear}
.bar.spark i{background:var(--spark)}
.eq{display:grid;grid-template-columns:3em minmax(0,1fr);gap:4px 8px;align-items:center;font-size:.78rem}
.eq span{color:var(--muted)}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.sk:last-child{border-bottom:0}
.sk .skn{font-size:.86rem;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sk .skd{grid-column:1 / -1;font-size:.72rem;color:var(--muted)}
.sk .acts{display:flex;gap:4px}
.src{font-size:.64rem;padding:0 5px;border-radius:2px;font-weight:700;letter-spacing:.04em}
.src.base{background:#2b2f44;color:var(--muted)} .src.book{background:#2a3546;color:var(--frost)}
.src.flash{background:#3d3820;color:var(--spark)} .src.teach{background:#3a2a2a;color:#e7a08f} .src.grant{background:#2c2236;color:#c8a6e6}
.notice{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:.88rem}
.notice.bad{border-color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:980px){.cols3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:820px){.cols,.cols3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.rule{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.rule:last-child{border-bottom:0}
.rule label{font-size:.85rem}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:inherit;font-size:.8rem;width:100%;min-width:0}
.combo{padding:10px 0;border-bottom:1px dashed var(--line)}
.combo:last-child{border-bottom:0}
.combo .cn{font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px}
.pips b{width:9px;height:9px;border:1px solid var(--gold-dim);transform:rotate(45deg);display:inline-block}
.pips b.on{background:var(--gold);border-color:var(--gold)}
.pips b.cap{border-style:dashed;opacity:.5}
.combo ol{margin:6px 0 4px;padding-left:1.3em;font-size:.82rem;color:#c9c3b3}
.combo .cond{font-size:.78rem;color:var(--muted)}
.know{padding-left:1.2em;margin:4px 0}
.know li{font-size:.84rem;margin-bottom:4px}
.know .q{color:var(--muted)}
.inv{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .in{font-weight:700;font-size:.86rem}
.it .id{grid-column:1 / -1;font-size:.74rem;color:var(--muted)}
.it .rd{grid-column:1 / -1;display:flex;gap:6px}
.grave{font-size:.85rem;color:var(--muted)}
.skp{border-color:var(--gold-dim)}
.relt{font-size:.8rem}
.relt th,.relt td{padding:4px 6px;text-align:center;white-space:nowrap}
.relt tbody th{text-align:left;color:var(--fg)}
.skp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.skp-h button{margin-left:auto}
.tline{margin-bottom:10px}
.tl-h{font-size:.78rem;color:var(--gold);letter-spacing:.1em;margin-bottom:4px}
.tn{font-size:.82rem;padding:3px 0;color:var(--muted)}
.tn.got{color:var(--fg)}
.tn b{font-weight:700}
.tn .br{color:var(--gold-dim);margin-right:4px}
.tdesc{font-size:.72rem;color:var(--muted)}
.cl{padding:8px 0;border-bottom:1px dashed var(--line)}
.cl:last-child{border-bottom:0}
.cl-n{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.cl.ok .cl-n b{color:var(--gold)}
.cl.cur{background:linear-gradient(90deg,rgba(226,189,100,.08),transparent)}
.cond{font-size:.76rem;color:var(--muted)}
.sty{padding:7px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.sty:last-child{border-bottom:0}
.sty.on b{color:var(--gold)}
.grave b{color:var(--fg);font-family:var(--f-display)}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--gold);color:#1a1408;border:0;border-radius:4px;padding:10px 22px;font-weight:700;letter-spacing:.1em}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btn.small{padding:3px 10px;font-size:.74rem;letter-spacing:.04em;white-space:nowrap;flex:none}
.btn.tiny{padding:1px 7px;font-size:.68rem;letter-spacing:0;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btn.tiny:hover{color:var(--gold);border-color:var(--gold-dim)}
/* ---------- 戦闘 ---------- */
.battle{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.battle{grid-template-columns:minmax(0,1fr)}}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.wave{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.06em}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.speed{display:flex;gap:4px}
.speed button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 10px;font-size:.8rem}
.speed button.on{border-color:var(--gold);color:var(--gold)}
.alert{min-height:2.2em;margin-bottom:8px;font-family:var(--f-display);font-weight:800;color:var(--warn);letter-spacing:.05em;font-size:1.05rem;display:flex;align-items:center}
.alert.on{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.45}}
.rowlbl{font-size:.7rem;letter-spacing:.2em;color:var(--muted);margin:6px 0 6px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.u{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;position:relative;min-width:0;user-select:none}
.u .un{font-weight:700;font-size:.88rem;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.u .un small{font-weight:400;color:var(--muted);font-size:.7rem}
.u .hp{margin-top:5px}
.u .hp i{background:var(--heal)}
.u.en .hp i{background:var(--enemy)}
.u .gauge{height:3px;margin-top:4px}
.u .gauge i{background:var(--gold-dim)}
.u .nums{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;min-height:18px}
.chip{font-size:.66rem;padding:0 6px;border-radius:3px;background:#0c0e15;color:var(--muted);letter-spacing:.04em}
.chip.frost{color:var(--frost)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.gold{color:var(--gold)} .chip.good{color:var(--heal)} .chip.spark{color:var(--spark)}
.u.en{cursor:pointer}
.u.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.u.wind{border-color:var(--warn)}
.u.frozen{border-color:var(--frost)}
.u.dead{opacity:.28}
.u.down{border-color:var(--bad)}
.u.lost{opacity:.35;filter:grayscale(1)}
.u.flash{box-shadow:0 0 0 2px var(--spark) inset}
.u.leader .un::after{content:"指揮";font-size:.62rem;color:var(--bg);background:var(--gold);padding:0 5px;border-radius:2px;font-weight:700;margin-left:auto}
.pop{position:absolute;right:8px;top:4px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;pointer-events:none;animation:rise .7s ease-out forwards}
.pop.dmg{color:var(--enemy)} .pop.heal{color:var(--heal)} .pop.crit{color:var(--gold);font-size:1rem}
@keyframes rise{from{transform:translateY(4px);opacity:1}to{transform:translateY(-10px);opacity:0}}
.oracle{margin-top:16px;background:var(--panel2);border:1px solid var(--gold-dim);border-radius:6px;padding:12px}
.divine{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--gold);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.divine .bar{flex:1;height:8px}
.obtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
@media (max-width:520px){.obtns{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ob{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 4px;display:flex;flex-direction:column;align-items:center}
.ob b{font-family:var(--f-display);font-size:1.15rem;font-weight:800;letter-spacing:.08em}
.ob small{font-size:.66rem;color:var(--muted)}
.ob:hover:not(:disabled){border-color:var(--gold)}
.ob:disabled{opacity:.35;cursor:not-allowed}
.pending{min-height:1.6em;font-size:.8rem;color:var(--gold);margin-top:8px}
.hint{font-size:.74rem;color:var(--muted);margin-top:4px}
.chron{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.log{height:560px;overflow-y:auto;font-size:.8rem;display:flex;flex-direction:column;gap:3px;padding-right:4px}
@media (max-width:900px){.log{height:300px}}
.ln{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:6px}
.ln .ts{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.7rem;padding-top:2px}
.ln.say .tx{color:#d8d1bd}
.ln.say b{color:var(--fg);font-family:var(--f-display)}
.ln.oracle .tx{color:var(--gold);font-family:var(--f-display);font-weight:600}
.ln.combo .tx{color:var(--gold);font-weight:700}
.ln.warn .tx{color:var(--warn);font-weight:700}
.ln.bad .tx{color:var(--bad);font-weight:700}
.ln.good .tx{color:var(--heal)}
.ln.miss .tx{color:var(--muted);font-style:italic}
.ln.disc .tx{color:var(--frost);font-weight:700}
.ln.flash .tx{color:var(--spark);font-weight:700;font-family:var(--f-display)}
.ln.sys .tx{color:var(--muted)}
.ln.skill .tx{color:#cfc8b6}
/* ---------- 結果 ---------- */
.verdict{font-family:var(--f-display);font-weight:800;font-size:2.2rem;letter-spacing:.2em;margin:4px 0}
.verdict.win{color:var(--gold)} .verdict.retreat{color:var(--frost)} .verdict.wipe{color:var(--bad)}
.report{font-family:var(--f-display);font-size:1.05rem;max-width:60ch;margin:6px 0 18px}
table{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:.74rem;letter-spacing:.08em}
.up{color:var(--heal)} .dn{color:var(--bad)}
.tw{overflow-x:auto}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:.82rem;color:var(--warn);flex-wrap:wrap}
/* ---------- 世界（布教地図・権能・酒場） ---------- */
.wmap{width:100%;height:auto;display:block;background:#0c0e15;border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
.wmap text{font-family:var(--f-body);font-size:8px}
.pw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:820px){.pw{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pwn{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:.76rem;margin-bottom:6px;color:var(--muted)}
.pwn b{display:block;font-size:.86rem;color:var(--fg)}
.pwn.on{border-color:var(--gold);background:rgba(226,189,100,.08)}
.pwn.on b{color:var(--gold)}
.pwn.can{border-color:var(--gold-dim)}
.rum{padding-left:1.1em;margin:4px 0}
.rum li{font-size:.84rem;margin-bottom:6px}
.rum .who{display:block;color:var(--muted);font-size:.7rem}
.resv{display:flex;flex-direction:column;gap:6px}
.rv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.rv:last-child{border-bottom:0}
.rv .cond{flex-basis:100%}
/* ---------- 神殿のタブと、下に固定した旅立ちの帯 ---------- */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.ptabs button{background:none;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;padding:8px 18px;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:.08em;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.ptabs button small{font-family:var(--f-body);font-weight:500;font-size:.68rem;color:var(--gold-dim)}
.ptabs button.on{color:var(--gold);border-color:var(--line);background:var(--panel);margin-bottom:-1px}
.ptabs button:hover:not(.on){color:var(--fg)}
.dock{position:sticky;bottom:0;z-index:5;margin-top:22px;padding:12px 14px;background:rgba(16,18,27,.96);border-top:1px solid var(--gold-dim);backdrop-filter:blur(4px)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.mrow{display:flex;gap:10px;align-items:baseline;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:.8rem;color:var(--muted);text-align:left}
.mrow b{color:var(--fg);font-family:var(--f-display);font-size:.95rem}
.mrow:hover{border-color:var(--gold-dim)}
@media (prefers-reduced-motion:reduce){.alert.on,.pop{animation:none}}
/* ================= 神殿（管理画面）：紺と金、斜めの区切り、文字は最小限 ================= */
:where(.tm) svg[aria-hidden]{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.tm .wmap{max-width:520px;margin:0 auto 8px}
.offer>svg{width:22px;height:22px;color:var(--gold)}
.tm{--ink:#0d1019;--card:#151a27;--card2:#1b2131;--hair:rgba(226,189,100,.28);--hair2:rgba(233,227,210,.12);position:relative}
.tm .lead{display:none}
.tm-nav{display:flex;align-items:stretch;justify-content:flex-end;gap:0;margin:-4px 0 18px;border-bottom:1px solid var(--hair2);flex-wrap:wrap}
.tm-nav .crest{margin-right:auto;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.7rem;letter-spacing:.2em;white-space:nowrap}
.tm-nav .crest svg{width:22px;height:22px;color:var(--gold)}
.tm-nav .crest b{font-family:var(--f-display);color:var(--gold);font-size:1.25rem;letter-spacing:.1em}
.tm-tab{position:relative;background:none;border:0;padding:8px 26px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--muted);min-width:96px}
.tm-tab b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.14em}
.tm-tab small{font-size:.56rem;letter-spacing:.32em;opacity:.7}
.tm-tab + .tm-tab::before{content:"";position:absolute;left:-2px;top:22%;height:56%;border-left:1px solid var(--hair2);transform:skewX(-20deg)}
.tm-tab.on{color:#1a1408;background:linear-gradient(180deg,#f0d18a,var(--gold));clip-path:polygon(12% 0,100% 0,88% 100%,0 100%)}
.tm-tab.on::before{display:none}
.tm-tab:hover:not(.on){color:var(--fg)}
.tm-tab .bdg{position:absolute;top:4px;right:14px;font-size:.6rem;font-weight:700;color:var(--bg);background:var(--bad);border-radius:99px;padding:0 5px;line-height:1.4}
.tm-tab.on .bdg{background:#1a1408;color:var(--gold)}
.tm-msg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.tm-msg div{background:linear-gradient(90deg,rgba(226,189,100,.16),rgba(226,189,100,.02) 70%);border-left:3px solid var(--gold);padding:7px 14px;font-size:.84rem}
.tm-msg div.bad{background:linear-gradient(90deg,rgba(224,96,90,.18),transparent 70%);border-color:var(--bad)}
/* 見出し：漢字＋細い線 */
.hd{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:.2em;color:var(--fg)}
.hd::before{content:"";width:3px;height:1em;background:var(--gold)}
.hd::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hair),transparent)}
.hd small{font-family:var(--f-body);font-size:.6rem;letter-spacing:.3em;color:var(--muted);font-weight:500}
/* 枠：角を一つ切り落とした板 */
.fr{position:relative;background:linear-gradient(160deg,var(--card2),var(--card) 60%);border:1px solid var(--hair2);padding:14px 16px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);min-width:0}
.fr::after{content:"";position:absolute;right:0;top:0;width:20px;height:1px;background:var(--gold);transform-origin:right;transform:translate(-1px,6px) rotate(45deg)}
/* 立ち絵 */
.pf{background-repeat:no-repeat;background-size:cover;background-position:50% 0}
.tm .sil{filter:brightness(.08) drop-shadow(0 0 1px rgba(226,189,100,.8))}
.tm .heir{filter:saturate(.55) brightness(.9) sepia(.15)}
.fc{position:relative;overflow:hidden;display:block;background:var(--ink)}
.fc>.fi{position:absolute;inset:0;display:block}.fc i{position:absolute;display:block;background-size:100% 100%}
/* ---- 旅立ち ---- */
.dep{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;align-items:start}
@media (max-width:1040px){.dep{grid-template-columns:minmax(0,1fr)}}
.line5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:620px){.line5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pc{position:relative;aspect-ratio:9/16;background:var(--ink);border:1px solid var(--hair2);overflow:hidden;padding:0;text-align:left;clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);transition:transform .15s,border-color .15s}
.pc:hover{transform:translateY(-3px);border-color:var(--gold)}
.pc .pf{position:absolute;inset:0;background-size:auto 112%;background-position:50% 0}
.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(10,12,20,.92) 78%)}
.pc .pcb{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 12px;z-index:1}
.pc .pcn{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.08em;line-height:1.1;display:block}
.pc .pcc{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--gold);letter-spacing:.1em;margin:2px 0 6px}
.pc .pcc svg{width:13px;height:13px}
.pc .pcl{position:absolute;top:8px;left:8px;z-index:1;font-size:.6rem;font-weight:700;color:#1a1408;background:var(--gold);padding:1px 6px;letter-spacing:.1em}
.pc .pcw{position:absolute;top:6px;right:8px;z-index:1;width:20px;height:20px;display:grid;place-items:center;background:var(--bad);color:#fff;font-weight:800;transform:rotate(45deg)}
.pc .pcw span{transform:rotate(-45deg);font-size:.75rem}
.tg{display:grid;grid-template-columns:14px minmax(0,1fr);gap:4px;align-items:center;margin-top:3px}
.tg svg{width:12px;height:12px;opacity:.85}
.tg .gb{height:4px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.tg .gb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#9c7f3d,var(--gold))}
.tg .gb.lo i{background:var(--bad)}
.pc.empty{display:grid;place-items:center;color:var(--muted);font-size:.8rem}
/* 戒律：段の切り替え */
.law{display:grid;grid-template-columns:22px 4.6em minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair2)}
.law:last-child{border-bottom:0}
.law svg{width:18px;height:18px;color:var(--gold)}
.law>span{font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;gap:3px;flex-wrap:wrap}
.seg button{background:transparent;border:1px solid var(--hair2);color:var(--muted);font-size:.74rem;padding:2px 9px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#1a1408;font-weight:700}
.seg button:hover:not(.on){color:var(--fg);border-color:var(--hair)}
.cmb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair2)}
.cmb:last-child{border-bottom:0}
.cmb b{font-family:var(--f-display);font-size:1rem;letter-spacing:.08em}
.cmb .who{grid-column:1/-1;display:flex;gap:4px;align-items:center}
.cmb .who{gap:12px;padding:6px 0 2px 6px}.cmb .who .fc{width:30px;height:30px;transform:rotate(45deg);border:1px solid var(--hair)}
.cmb .who .fc>.fi{transform:rotate(-45deg) scale(1.42)}
.cmb .who .fc.miss{opacity:.25}
.cmb .who em{font-style:normal;font-size:.7rem;color:var(--muted);margin-left:6px}
/* 下の帯：道のりと旅立つ */
.tm .dock{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(90deg,rgba(13,16,25,.97),rgba(21,26,39,.97));border-top:1px solid var(--hair)}
.route{display:flex;align-items:center;gap:0;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.route span{padding:3px 14px 3px 10px;background:var(--card2);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);margin-right:-4px}
.route span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%)}
.route span.cp{background:transparent;color:var(--gold);padding:3px 8px}
.route span.dn{background:rgba(214,114,98,.22);color:var(--fg)}
.flr{display:flex;gap:3px;flex-wrap:wrap}
.flr button{background:var(--card2);border:1px solid var(--hair2);color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:.85rem;padding:2px 10px;line-height:1.2;display:flex;flex-direction:column;align-items:center}
.flr button small{font-family:var(--f-body);font-size:.55rem;font-weight:500;letter-spacing:.05em}
.flr button.on{border-color:var(--gold);color:var(--gold);background:rgba(226,189,100,.1)}
.flr button.new{border-style:dashed}
.go{margin-left:auto;background:linear-gradient(180deg,#f2d48e,var(--gold) 55%,#b8913f);color:#1a1408;border:0;padding:10px 46px 8px 52px;clip-path:polygon(18px 0,100% 0,calc(100% - 18px) 100%,0 100%);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.go b{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.3em;font-weight:800}
.go small{font-size:.56rem;letter-spacing:.4em}
.go:hover{filter:brightness(1.08)}
.go:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.meta{font-size:.68rem;color:var(--muted);letter-spacing:.08em}
@media (max-width:620px){.tm .route,.tm .meta{display:none}.tm .dock{gap:8px;padding:8px 10px}.go{padding:8px 30px 6px 34px}.go b{font-size:1.1rem}}
/* ---- 一行：人物詳細 ---- */
.pick{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pick button{background:none;border:0;padding:0;position:relative}
.pick .fc{width:44px;height:44px;transform:rotate(45deg);border:1px solid var(--hair2);margin:6px}
.pick .fc>.fi{transform:rotate(-45deg) scale(1.42)}
.pick button.on .fc{border:2px solid var(--gold);box-shadow:0 0 12px rgba(226,189,100,.45)}
.pick button.rs .fc{opacity:.55}
.pick .sep{width:1px;height:34px;background:var(--hair2);margin:0 6px}
.pick .w{position:absolute;right:-2px;top:-2px;width:10px;height:10px;background:var(--bad);transform:rotate(45deg)}
.grace{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.66rem;letter-spacing:.2em;color:var(--muted)}
.grace b{color:var(--gold);font-size:1rem;letter-spacing:.1em}
.prof{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:0;min-height:620px;background:var(--ink);border:1px solid var(--hair2);position:relative;overflow:hidden}
@media (max-width:860px){.prof{grid-template-columns:minmax(0,1fr)}}
.prof .art{position:relative;min-height:520px;overflow:hidden}
.prof .art .pf{position:absolute;inset:0;background-size:max(118%,auto 100%);background-size:118% auto;background-position:50% 14%}
.prof .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 70%,var(--ink)),linear-gradient(180deg,transparent 75%,var(--ink))}
.prof .art .wish{position:absolute;left:16px;right:30px;bottom:16px;z-index:1;font-family:var(--f-display);font-size:.92rem;color:#efe6cf;text-shadow:0 1px 4px #000;letter-spacing:.04em}
.prof .art .wish::before{content:"“";color:var(--gold);font-size:1.6rem;line-height:0;vertical-align:-.35em;margin-right:4px}
.prof .side{position:relative;padding:22px 24px 20px 30px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(100deg,transparent,rgba(27,33,49,.85) 6%);clip-path:polygon(28px 0,100% 0,100% 100%,0 100%)}
@media (max-width:860px){.prof .side{clip-path:none;padding:18px 16px}}
.who-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:center}
.who-h .nm{font-family:var(--f-display);font-weight:800;font-size:3rem;letter-spacing:.08em;line-height:1}
.who-h .cls{display:flex;align-items:center;gap:8px;border-top:1px solid var(--hair);padding-top:6px;font-size:.95rem;letter-spacing:.2em}
.who-h .cls svg{width:20px;height:20px;color:var(--gold)}
.who-h .gs{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:7px;border-left:1px solid var(--hair2);padding-left:20px}
@media (max-width:620px){.who-h{grid-template-columns:minmax(0,1fr)}.who-h .gs{grid-row:auto;grid-column:auto;border-left:0;padding-left:0}}
.gg{display:grid;grid-template-columns:20px 2.6em minmax(0,1fr) 2.2em;gap:8px;align-items:center;font-size:.8rem;letter-spacing:.1em}
.gg svg{width:18px;height:18px;color:var(--gold)}
.gg .gb{height:7px;background:rgba(255,255,255,.08);clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%);position:relative}
.gg .gb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8d7236,var(--gold))}
.gg .gb.lo i{background:linear-gradient(90deg,#7a2c28,var(--bad))}
.gg .gb.sp i{background:linear-gradient(90deg,#6e6a2a,var(--spark))}
.gg b{font-variant-numeric:tabular-nums;text-align:right;font-size:.85rem}
.chips2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips2 .c{font-size:.68rem;letter-spacing:.12em;padding:1px 9px;border:1px solid var(--hair2);color:var(--muted);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.chips2 .c.g{border-color:var(--gold);color:var(--gold)}
.chips2 .c.w{border-color:var(--warn);color:var(--warn)}
.chips2 .c.b{border-color:var(--bad);color:var(--bad)}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat4 div{background:rgba(255,255,255,.03);border-bottom:2px solid var(--hair);padding:4px 8px;display:flex;flex-direction:column}
.stat4 small{font-size:.6rem;letter-spacing:.2em;color:var(--muted)}
.stat4 b{font-family:var(--f-display);font-size:1.3rem;line-height:1.15;font-variant-numeric:tabular-nums}
/* 技のタイル */
.skt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:620px){.skt{grid-template-columns:repeat(3,minmax(0,1fr))}}
.st{position:relative}
.st>summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.st>summary::-webkit-details-marker{display:none}
.st .ic{width:100%;aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a3146,#141927 75%);border:1px solid var(--hair);position:relative}
.st .ic svg{width:56%;height:56%;color:#e8e0cc;filter:drop-shadow(0 0 6px rgba(226,189,100,.35))}
.st .ic .sb{position:absolute;left:0;top:0;font-size:.58rem;font-weight:700;padding:0 4px}
.st.base .ic{border-color:var(--hair2);background:#141927}
.st.base .ic svg{opacity:.6}
.st.none .ic{border-style:dashed;border-color:var(--hair2);background:transparent}
.st .sn{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-align:center;line-height:1.2}
.st[open] .ic{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.st .pop2{position:absolute;z-index:6;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:230px;background:#0e121c;border:1px solid var(--gold-dim);padding:10px 12px;font-size:.76rem;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.st .pop2 .acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.eqs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:620px){.eqs{grid-template-columns:minmax(0,1fr)}}
.eqb{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 8px;align-items:center;background:rgba(255,255,255,.03);border-left:2px solid var(--hair);padding:6px 8px}
.eqb svg{grid-row:1/3;width:24px;height:24px;color:var(--gold)}

.eqb select{background:transparent;border:0;padding:0;font-size:.82rem;color:var(--fg);font-weight:700}
.eqb select option{background:var(--panel2)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.relg{width:100%;height:auto;display:block}
.relg .nd{cursor:pointer}

.acts2{display:flex;gap:6px;flex-wrap:wrap}
.ab{background:rgba(255,255,255,.03);border:1px solid var(--hair2);color:var(--fg);font-size:.76rem;padding:6px 12px 6px 10px;display:flex;align-items:center;gap:6px;letter-spacing:.06em;clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
.ab svg{width:15px;height:15px;color:var(--gold)}
.ab small{color:var(--gold);font-size:.66rem}
.ab:hover:not(:disabled){border-color:var(--gold)}
.ab:disabled{opacity:.35;cursor:not-allowed}
.ab.gold{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}

.mini2{font-size:.72rem;color:var(--muted)}
.rsv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* 技能と職：前面に出す板 */
.ovl{position:fixed;inset:0;z-index:40;background:rgba(6,8,13,.78);backdrop-filter:blur(3px);overflow:auto;padding:40px max(16px,4vw)}

/* ---- 世界 ---- */
.wld{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.wld{grid-template-columns:minmax(0,1fr)}}
.tm .wmap{background:radial-gradient(circle at 40% 40%,#1b2133,#0c0f18);border:1px solid var(--hair2);border-radius:0}
.pwt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.pwt{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pwc{display:flex;flex-direction:column;align-items:center;gap:0}

.pwn2.lock{opacity:.45}
.big{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--gold)}

}

/* 立ち絵。後継者は親の絵を色を落として、信者はその職の影絵で見せる */
const ROLE_FACE={sword:'gareth',tank:'borg',mage:'erin',hunter:'mira',priest:'rio',thief:'raz'};
function faceOf(id){let k=id,heir=false;
  while(!PORTRAIT[k]&&CHAR_DB[k]&&CHAR_DB[k].parent){k=CHAR_DB[k].parent;heir=true;}
  if(PORTRAIT[k])return{k,heir,sil:false};
  return{k:ROLE_FACE[CHAR_DB[id].role],heir:false,sil:true};}
const pfDiv=(id,extra)=>{const f=faceOf(id);return `<div class="pf pf-${f.k}${f.sil?' sil':''}${f.heir?' heir':''}" ${extra||''}></div>`;};
/* 顔だけを切り出した小窓。FACE[k]=[顔の中心x,y（絵の幅・高さに対する割合）] */
function faceBox(id,cls){const f=faceOf(id);const [fx,fy]=FACE[f.k]||[.5,.25];const s=3.1,ar=PORT_AR;
  return `<span class="fc ${cls||''}"><span class="fi"><i class="pf-${f.k}${f.sil?' sil':''}${f.heir?' heir':''}" style="width:${s*100}%;height:${s*ar*100}%;left:${(50-fx*s*100).toFixed(1)}%;top:${(50-fy*s*ar*100).toFixed(1)}%"></i></span></span>`;}
function installPortraits(){if(document.getElementById('pf-css'))return;const st=document.createElement('style');st.id='pf-css';
  st.textContent=Object.entries(PORTRAIT).map(([k,v])=>`.pf-${k}{background-image:url(${v})}`).join('\n');document.head.appendChild(st);}
const tg=(k,v,lo)=>`<div class="tg" title="${k} ${Math.round(v)}">${ico(k)}<div class="gb${lo?' lo':''}"><i style="width:${clamp(v,0,100)}%"></i></div></div>`;
const gg=(k,v,cls)=>`<div class="gg">${ico(k)}<span>${k}</span><div class="gb ${cls||''}"><i style="width:${clamp(v,0,100)}%"></i></div><b>${Math.round(v)}</b></div>`;

/* ============ 神殿（準備） ============ */
let prepNotice=[];
let PSEL=null;   // 「一行」タブで見ている人
let PREP_TAB='depart';   // 神殿のタブ：depart 旅立ち / party 一行 / world 世界 / store 蔵
/* 奉納：余った装備や書物を神殿の祭壇へ。3品ごとに拠点の町の信仰が1上がる */
function offer(n){const before=Math.floor((S.offered||0)/3);S.offered=(S.offered||0)+n;const g=Math.floor(S.offered/3)-before;const up=g?addBelief(BASE_TOWN,g):0;return up;}
/* 戒律：短い言葉の切り替え。詳しい意味は、ボタンに指を置くと出る */
const LAWS=[
  ['target','目標',[['weak','弱った敵','弱った敵から倒す'],['caster','術者','術者を優先して狙う'],['strong','強敵','最も強い敵から狙う']]],

  ['combo','連携',[['aggressive','積極','連携技を積極的に狙う（技を温存する）'],['safe','堅実','習熟した連携技だけ使う']]],
  ['retreat','撤退',[['lost','一人失う','誰かを失ったら撤退'],['two','二人倒れる','二人倒れたら撤退'],['never','退かない','撤退しない']]],
  ['camp','野営',[['watch','見張り','見張りを立てる（回復は控えめ・夜襲に備える）'],['rest','熟睡','ぐっすり休む（よく回復するが、夜襲では寝込みを突かれる）']]],
];
function renderPrep(){
  stopLoop(); setSteps('prep'); installPortraits();
  const added=fillParty(); if(added.length)prepNotice=prepNotice.concat(added); persist();
  const ids=partyIds(); const P=S.policy;
  const over=ids.filter(id=>(S.skills[id]||[]).length>4);
  // ---- 知らせ（どのタブでも上に） ----
  const msgs=[];
  if(prepNotice.length){msgs.push(`新たな仲間：${prepNotice.map(id=>{const d=CHAR_DB[id];return `<b>${d.name}</b>（${ROLES[d.role]}${d.parent?`・${CHAR_DB[d.parent].name}の${d.rel}`:d.town?`・${TOWNS[d.town].name}の信者`:''}）`;}).join('、')}。前の仲間との連携技の習熟は引き継がれない`);prepNotice=[];}
  for(const m of prepMsgs.concat(worldMsgs))msgs.push(m);prepMsgs=[];worldMsgs=[];
  let h='<div class="tm">';
  // ---- 上のタブ ----
  const inv=inventory();
  const warnN=ids.filter(id=>S.contact[id]||S.loyal[id]<40).length+over.length;
  const canPw=Object.entries(POWERS).some(([k,p])=>!hasP(k)&&(!p.req||hasP(p.req))&&S.divinity>=p.cost);
  const TABS=[['depart','旅立ち','DEPART',''],['party','一行','PARTY',(warnN+S.visitors.length)||''],['world','世界','WORLD',canPw?'✶':''],['store','蔵','DEPOT','']];
  if(!TABS.some(t=>t[0]===PREP_TAB))PREP_TAB='depart';
  h+=`<nav class="tm-nav" role="tablist"><div class="crest">${ico('信仰')}<b>神殿</b>${calTxt()}</div>${TABS.map(([k,n,en,b])=>`<button role="tab" aria-selected="${k===PREP_TAB}" class="tm-tab ${k===PREP_TAB?'on':''}" data-ptab="${k}"><b>${n}</b><small>${en}</small>${b!==''?`<span class="bdg">${b}</span>`:''}</button>`).join('')}</nav>`;
  if(msgs.length||over.length)h+=`<div class="tm-msg">${over.length?`<div class="bad">技は一人4つまで：${over.map(id=>CHAR_DB[id].name).join('、')}の技を整理してください（体得した書物の技は、伝書に書き残せる）</div>`:''}${msgs.map(m=>`<div>${m}</div>`).join('')}</div>`;
  h+={depart:()=>departHtml(ids),party:()=>partyHtml(ids),world:()=>worldHtml(ids),store:()=>storeHtml(ids,inv)}[PREP_TAB]();
  // ---- 下に固定：道のり・潜る階・旅立つ ----
  const fls=[];for(let f=3;f<=S.depth;f++)fls.push(f);
  h+=`<div class="dock"><div class="route" title="野営を2夜はさむ"><span>${TOWNS[BASE_TOWN].name.replace(/^(鉱山町|王都|港町|森の集落|宿場町)/,'')}</span><span>岩の丘</span><span class="cp">${ico('野営')}</span><span>北の街道</span><span class="cp">${ico('野営')}</span><span class="dn">${floorName(S.floor)}</span></div>
    <div class="flr" role="radiogroup" aria-label="潜る階">${fls.map(f=>`<button role="radio" aria-checked="${f===S.floor}" class="${f===S.floor?'on':''}${f===S.depth?' new':''}" data-floor="${f}" title="${floorName(f)}${f===S.depth?'（未踏）':''}・敵の強さ×${floorMul(f).toFixed(2)}">B${f}<small>×${floorMul(f).toFixed(2)}</small></button>`).join('')}</div>
    <span class="meta">潜行 ${S.runs}・帰還 ${S.wins}</span>
    <button class="go" id="go" ${over.length?'disabled':''}><b>旅立つ</b><small>DEPART</small></button></div>`;
  if(SKV&&CHAR_DB[SKV])h+=`<div class="ovl" id="ovl">${skillPanel(SKV)}</div>`;else SKV=null;

    h+=`<details class="st"><summary><span class="ic">${ico(sk.line)}<span class="sb src ${s.src}">${SRC[s.src]}</span></span><span class="sn">${sk.name}</span>${pips(s.st,cap)}</summary>
      <div class="pop2"><b>${sk.name}</b>　<span class="muted">${STAGE[s.st]}${s.st<cap?`・経験 ${s.exp}/${EXP_NEED[s.st]}`:''}${cap===3&&s.st===3?'・開眼待ち':''}</span><br>${sk.desc}${s.src==='flash'?'<br><span class="muted">閃いた技は書物にできず、師弟の口伝でしか継げない</span>':''}
      <div class="acts">${canWrite?`<button class="btn tiny" data-write="${id}|${s.k}">伝書を記す</button>`:''}<button class="btn tiny" data-forget="${id}|${s.k}">忘れる</button></div></div></details>`;}
  for(const g of st.grants){const sk=SKILLS[g.k];if(knows(id,g.k))continue;

  for(let i=sks.length;i<4;i++)h+=`<div class="st none"><span class="ic"></span></div>`;

/* 関係図：真ん中に本人、まわりに仲間。線の色と太さが仲の良さ */
function relGraph(id){
  const others=partyIds().filter(o=>o!==id);if(!others.length)return '<p class="mini2">一行にほかの仲間がいない</p>';
  const W=300,H=190,cx=150,cy=95;const n=others.length;
  const pos=others.map((o,i)=>{const a=Math.PI*(-.5+ (i+.5)/n*2);return [cx+Math.cos(a)*118,cy+Math.sin(a)*70];});
  let svg=`<svg viewBox="0 0 ${W} ${H}" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">`;
  others.forEach((o,i)=>{const v=relOf(id,o);const [x,y]=pos[i];const col=v>=40?'var(--gold)':v>=0?'rgba(233,227,210,.45)':v>-40?'var(--warn)':'var(--bad)';
    svg+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${(1+Math.abs(v)/25).toFixed(1)}" ${v<0?'stroke-dasharray="4 3"':''}/>`;
    svg+=`<text x="${(cx+x)/2}" y="${(cy+y)/2-4}" text-anchor="middle" style="font-size:10px;fill:${col}">${v>0?'+':''}${v}</text>`;});
  svg+='</svg>';
  let h=`<div style="position:relative;aspect-ratio:${W}/${H};width:100%">${svg}`;
  const node=(o,x,y,sz,cls)=>`<button data-psel="${o}" title="${CHAR_DB[o].name}" style="position:absolute;left:${x/W*100}%;top:${y/H*100}%;transform:translate(-50%,-50%);background:none;border:0;padding:0">${faceBox(o,cls)}</button>`;
  h+=node(id,cx,cy,0,'me');
  others.forEach((o,i)=>{h+=node(o,pos[i][0],pos[i][1],0,'');});
  return h+`<style>.prof .two .fc{width:46px;height:46px;transform:rotate(45deg);border:1px solid var(--hair)}.prof .two .fc>.fi{transform:rotate(-45deg) scale(1.42)}.prof .two .fc.me{width:64px;height:64px;border:2px solid var(--gold);box-shadow:0 0 14px rgba(226,189,100,.4)}</style></div>`;}
/* ---- 蔵 ---- */

let B=null,timer=null;
function stopLoop(){if(timer){clearInterval(timer);timer=null;}}
function makeUnit(id){const d=CHAR_DB[id];const st=equipStats(id);const dc=decline(id);
  const skills=(S.skills[id]||[]).slice();
  for(const g of st.grants)if(!knows(id,g.k))skills.push({k:g.k,st:g.st,exp:0,src:'grant',temp:true});
  return{id,side:'p',role:d.role,name:d.name,pers:d.pers,max:d.hp+st.hp,hp:d.hp+st.hp,atk:(d.atk+st.atk)*(1-dc),spd:d.spd*(1+st.spd)*(1-dc/2),def:Math.min(.7,d.def+st.def),
  flashB:st.flash,frost:st.frost,healB:st.heal,skills,scd:{},parry:0,flashT:-9,abs:(S.aslot[id]||[]).filter(k=>(S.abil[id]||[]).includes(k)),
  gauge:Math.random()*0.5,cd:{taunt:0,mist:0,pierce:0},taunt:0,state:'ok',down:0,busy:0,pop:null};}
let eid=0;
/* 迷宮の中では、階に応じて敵のHP・攻撃・閃きやすさが上がる（B.emul / B.fmul。街道と野営では1） */
function makeEnemy(kind,suf){const d=ENEMY_DB[kind];const m=(B&&B.emul)||1,am=(B&&B.amul)||1;const hp=Math.round(d.hp*m);
  return{id:'e'+(eid++),side:'e',kind,name:d.name+(suf||''),max:hp,hp,atk:d.atk*am,amul:am,spd:d.spd,fmul:(B&&B.fmul)||1,
  gauge:Math.random()*0.4,frozen:0,stun:0,wind:0,cycle:0,state:'ok',pop:null};}
function spawnWave(n){
  const f=B.floor||3;B.place=floorName(f);B.emul=floorMul(f);B.amul=floorAtk(f);B.fmul=floorFlash(f);
  if(n===1){B.rivalAhead=!!(S.next&&S.next.rival==='ahead');
    B.enemies=B.rivalAhead?[makeEnemy('goblin','A'),makeEnemy('shaman'),makeEnemy('goblin','B')]:[makeEnemy('goblin','A'),makeEnemy('goblin','B'),makeEnemy('shaman'),makeEnemy('goblin','C'),makeEnemy('goblin','D')];
    // 深い階ほど群れが大きい
    if(f>=5)B.enemies.push(makeEnemy('shaman','Ⅱ'));
    if(f>=7)B.enemies.push(makeEnemy('goblin','E'));}
  else{B.enemies=[makeEnemy('goblin','E'),makeEnemy('ogre'),makeEnemy('goblin','F')];B.rivalNpc=!!(S.next&&S.next.rival==='trouble');
    if(f>=6)B.enemies.push(makeEnemy('shaman'));
    if(f>=8)B.enemies.push(makeEnemy('goblin','G'));
    if(f>=10)B.enemies.push(makeEnemy('strayogre'));   // 二体目の大物は、十分に育ってから
    const tr=S.defected.filter(id=>!B.traitorSeen);
    if(tr.length&&Math.random()<0.6){const id=pick(tr);const d=CHAR_DB[id];const e=makeEnemy('traitor');Object.assign(e,{name:`${d.name}（大神の使徒）`,tid:id,max:Math.round(d.hp*1.8),hp:Math.round(d.hp*1.8),atk:d.atk*1.4,spd:d.spd});
      B.enemies.push(e);B.traitorSeen=true;
      setTimeout(()=>{if(!B||B.over)return;log(`${d.name}が大神の使徒として立ちはだかった！`,'warn');const f=okU().sort((a,b)=>relOf(b.id,id)-relOf(a.id,id))[0];if(f)say(f,relOf(f.id,id)>=30?`${d.name}……どうしてだ！`:`裏切り者が。手加減はしない`);},50);}}
  B.wave=n; B.selected=null;
}
function applyAbStats(u){
  if(hasAb(u,'jouheki'))u.def=Math.min(.75,u.def+.15);
  if(hasAb(u,'sokusha'))u.spd*=1.15; if(hasAb(u,'kagebashiri'))u.spd*=1.1;
  if(hasAb(u,'sentei'))u.gauge=Math.max(u.gauge,.5);
}
function guardStart(){const h=okU().find(u=>hasAb(u,'inoritate'));if(h){for(const x of okU())heal(h,x,14);log(`${h.name}の祈りの盾が皆を癒やした`,'good');}}
function trapStart(){const h=okU().find(u=>hasAb(u,'trap'));if(h){const e=pick(okE());if(e){e.stun=Math.max(e.stun,2);log(`${h.name}の仕掛けた罠に${e.name}がかかった`,'sys');}}}
/* ===== 旅路：区画 → 野営 → 区画 → 野営 → 迷宮（2波）を、同じ戦闘の流れでつなぐ ===== */
function buildPlan(){const n=S.next||{};return[{t:'road',area:'hill',enc:n.hill},{t:'camp',night:0},{t:'road',area:'north',enc:n.north},{t:'camp',night:1},{t:'dun',w:1},{t:'dun',w:2}];}
function waveStart(surprise){
  if(surprise){for(const u of okU())u.gauge=0;for(const e of B.enemies)e.gauge=rnd(.6,.9);}
  else{for(const u of okU())if(hasAb(u,'sentei'))u.gauge=Math.max(u.gauge,.5);trapStart();}
}
function reviveDowns(){for(const u of B.units)if(u.state==='down'){u.state='ok';u.hp=Math.max(1,u.max*.1);u.down=0;log(`${u.name}を担ぎ起こした`,'good');}}
function advance(){
  const prev=B.plan[B.si];
  if(prev&&(prev.t==='road'||prev.t==='camp'))reviveDowns();
  if(prev&&prev.t==='dun'&&prev.w===2&&B.rivalNpc&&!B.rivalSaved){B.rivalSaved=true;log(`${S.rival.name}の若い剣士を助け起こした。「……小神の一行に、借りができた」`,'good');
    const L=getLeader();if(L)say(L,L.pers==='皮肉屋'?'貸しにしておくわ。大神様によろしく':'立てるか。地上まで送ろう');}
  B.si++;const st=B.plan[B.si];
  if(!st){endBattle('win');return;}
  if(st.t!=='dun'){B.emul=1;B.amul=1;B.fmul=1;}
  if(st.t==='road'){B.place=AREAS[st.area].name;B.wave=0;
    if(st.enc&&ROAD_ENC[st.enc]){B.enemies=ROAD_ENC[st.enc].make();B.selected=null;log(ROAD_ENC[st.enc].msg,'warn');waveStart(false);}
    else{B.enemies=[];log(`${AREAS[st.area].name}を越えた。敵影はない`,'sys');B.waveWait=1.2;B.nextFn=advance;}
  }else if(st.t==='camp'){camp(st.night);}
  else if(st.w===1){spawnWave(1);log(B.rivalAhead?`${B.place}。${S.rival.name}が先に通った跡がある。敵影は${B.enemies.length}つ――宝も荒らされているだろう`:`${B.place}。前方に敵影が${B.enemies.length}つ。`,'sys');waveStart(false);}
  else{B.enemies=[];log('回廊の奥から地響きが近づいてくる……','warn');B.waveWait=3;
    B.nextFn=()=>{spawnWave(2);log('オーガが姿を現した。ゴブリンが2体従っている','warn');
      if(B.rivalNpc)log(`オーガの足元に、${S.rival.name}の若い剣士が倒れている。オーガに追われてきたらしい`,'warn');waveStart(false);};}
}
function fireTalk(alive,amt){
  const a=pick(alive);const b=pick(alive.filter(x=>x!==a));
  const c=COMPAT[[a.pers,b.pers].sort().join('|')]||0;const p=clamp(.5+relOf(a.id,b.id)/200+c*.06,.1,.9);
  const good=Math.random()<p;addRel(a.id,b.id,good?amt:-amt);
  const txt=pick(good?FIRE_POS:FIRE_NEG).replace('{a}',a.name).replace('{b}',b.name);B.relNotes.push('焚き火：'+txt);return{txt,good};
}
function camp(n){
  B.enemies=[];B.wave=0;B.place=`${AREAS[n?'north':'hill'].name}・野営`;
  const watch=S.policy.camp==='watch';const kei=okU().find(u=>hasAb(u,'keikai'));
  log(`${n?'二':'一'}夜目の野営。${watch?'交代で見張りを立てる':'見張りを置かず、ぐっすり休む'}`,'sys');
  for(const u of okU())heal(null,u,u.max*(watch?(kei?.55:.4):.7));
  if(okU().length>=2){const r=fireTalk(okU(),5);log('焚き火：'+r.txt,r.good?'good':'miss');}
  const raid=S.next&&S.next.raid&&S.next.raid[n];
  if(raid){const surprise=!watch&&!kei;B.enemies=RAIDS[n]();B.selected=null;
    if(kei&&!watch)log(`${kei.name}が物音で跳ね起きた。「起きな、囲まれてる！」`,'warn');

    waveStart(surprise);}
  else{log('夜は静かに明けた','sys');B.waveWait=2;B.nextFn=advance;}
}
function trySteal(u,e){
  if(!u||u.side!=='p'||e.state!=='ok'||e.kind==='traitor')return;
  const ch=(u.role==='thief'?.015:0)+(hasAb(u,'nusumu')?.02:0);if(!ch)return;

}

  log(`${calTxt()}。${TOWNS[BASE_TOWN].name}を発つ。目指すは東の大迷宮`,'sys');

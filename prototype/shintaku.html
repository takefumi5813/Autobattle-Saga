<meta charset="utf-8">
<title>神託の迷宮</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 神の視点。準備（神殿）と戦場（盤）と帰還（記録）を切り替える一画面ゲーム。盤は上に敵・下に仲間・脇に年代記 */
:root{
  color-scheme: dark;
  --bg:#10121b; --panel:#181b28; --panel2:#1f2336; --line:#2d3249;
  --fg:#e9e3d2; --muted:#9692aa; --gold:#e2bd64; --gold-dim:#7d6a3c;
  --enemy:#d67262; --heal:#76c6a2; --frost:#8fc5ec; --warn:#f2a54e; --bad:#e0605a; --spark:#f3e27a;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.65;
  background-image:radial-gradient(1200px 500px at 50% -200px, #2a2540 0%, transparent 70%);}
.app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.08em}
.brand .mark{color:var(--gold);margin-right:.3em}
.brand small{font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.1em;margin-left:.8em}
.steps{display:flex;gap:6px;font-size:.78rem;color:var(--muted);letter-spacing:.12em}
.steps span{padding:2px 10px;border:1px solid var(--line);border-radius:99px}
.steps span.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
h2{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:.06em;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.06em;margin:0 0 8px;color:var(--gold)}
h4{font-size:.72rem;letter-spacing:.18em;color:var(--muted);font-weight:500;margin:10px 0 4px}
.lead{color:var(--muted);max-width:72ch;margin:0 0 18px}
.sec{margin-bottom:26px}
.muted{color:var(--muted)}
.small{font-size:.8rem}
/* ---------- 準備 ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:420px){.roster{grid-template-columns:minmax(0,1fr)}}
.char{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.char .nm{font-family:var(--f-display);font-size:1.15rem;font-weight:800;letter-spacing:.05em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.char .nm small{font-family:var(--f-body);font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.08em}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;padding:0 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tag.gold{color:var(--gold);border-color:var(--gold-dim)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.char .bio{font-size:.82rem;color:#c9c3b3;margin:0}
.char .wish{font-size:.82rem;color:var(--gold);margin:0;font-family:var(--f-display)}
.meter{display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .bar{flex:1}
.bar{height:6px;background:#0c0e15;border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--gold);transition:width .12s linear}
.bar.spark i{background:var(--spark)}
.eq{display:grid;grid-template-columns:3em minmax(0,1fr);gap:4px 8px;align-items:center;font-size:.78rem}
.eq span{color:var(--muted)}
.sk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line)}
.sk:last-child{border-bottom:0}
.sk .skn{font-size:.86rem;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sk .skd{grid-column:1 / -1;font-size:.72rem;color:var(--muted)}
.sk .acts{display:flex;gap:4px}
.src{font-size:.64rem;padding:0 5px;border-radius:2px;font-weight:700;letter-spacing:.04em}
.src.base{background:#2b2f44;color:var(--muted)} .src.book{background:#2a3546;color:var(--frost)}
.src.flash{background:#3d3820;color:var(--spark)} .src.teach{background:#3a2a2a;color:#e7a08f} .src.grant{background:#2c2236;color:#c8a6e6}
.notice{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:.88rem}
.notice.bad{border-color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:980px){.cols3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:820px){.cols,.cols3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.rule{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.rule:last-child{border-bottom:0}
.rule label{font-size:.85rem}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:inherit;font-size:.8rem;width:100%;min-width:0}
.combo{padding:10px 0;border-bottom:1px dashed var(--line)}
.combo:last-child{border-bottom:0}
.combo .cn{font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pips{display:inline-flex;gap:3px}
.pips b{width:9px;height:9px;border:1px solid var(--gold-dim);transform:rotate(45deg);display:inline-block}
.pips b.on{background:var(--gold);border-color:var(--gold)}
.pips b.cap{border-style:dashed;opacity:.5}
.combo ol{margin:6px 0 4px;padding-left:1.3em;font-size:.82rem;color:#c9c3b3}
.combo .cond{font-size:.78rem;color:var(--muted)}
.know{padding-left:1.2em;margin:4px 0}
.know li{font-size:.84rem;margin-bottom:4px}
.know .q{color:var(--muted)}
.inv{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it .in{font-weight:700;font-size:.86rem}
.it .id{grid-column:1 / -1;font-size:.74rem;color:var(--muted)}
.it .rd{grid-column:1 / -1;display:flex;gap:6px}
.grave{font-size:.85rem;color:var(--muted)}
.skp{border-color:var(--gold-dim)}
.relt{font-size:.8rem}
.relt th,.relt td{padding:4px 6px;text-align:center;white-space:nowrap}
.relt tbody th{text-align:left;color:var(--fg)}
.skp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.skp-h button{margin-left:auto}
.tline{margin-bottom:10px}
.tl-h{font-size:.78rem;color:var(--gold);letter-spacing:.1em;margin-bottom:4px}
.tn{font-size:.82rem;padding:3px 0;color:var(--muted)}
.tn.got{color:var(--fg)}
.tn b{font-weight:700}
.tn .br{color:var(--gold-dim);margin-right:4px}
.tdesc{font-size:.72rem;color:var(--muted)}
.cl{padding:8px 0;border-bottom:1px dashed var(--line)}
.cl:last-child{border-bottom:0}
.cl-n{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.cl.ok .cl-n b{color:var(--gold)}
.cl.cur{background:linear-gradient(90deg,rgba(226,189,100,.08),transparent)}
.cond{font-size:.76rem;color:var(--muted)}
.sty{padding:7px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.sty:last-child{border-bottom:0}
.sty.on b{color:var(--gold)}
.grave b{color:var(--fg);font-family:var(--f-display)}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--gold);color:#1a1408;border:0;border-radius:4px;padding:10px 22px;font-weight:700;letter-spacing:.1em}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btn.small{padding:3px 10px;font-size:.74rem;letter-spacing:.04em;white-space:nowrap;flex:none}
.btn.tiny{padding:1px 7px;font-size:.68rem;letter-spacing:0;background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btn.tiny:hover{color:var(--gold);border-color:var(--gold-dim)}
/* ---------- 戦闘 ---------- */
.battle{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.battle{grid-template-columns:minmax(0,1fr)}}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.wave{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.06em}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.speed{display:flex;gap:4px}
.speed button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 10px;font-size:.8rem}
.speed button.on{border-color:var(--gold);color:var(--gold)}
.alert{min-height:2.2em;margin-bottom:8px;font-family:var(--f-display);font-weight:800;color:var(--warn);letter-spacing:.05em;font-size:1.05rem;display:flex;align-items:center}
.alert.on{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.45}}
.rowlbl{font-size:.7rem;letter-spacing:.2em;color:var(--muted);margin:6px 0 6px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.u{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;position:relative;min-width:0;user-select:none}
.u .un{font-weight:700;font-size:.88rem;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.u .un small{font-weight:400;color:var(--muted);font-size:.7rem}
.u .hp{margin-top:5px}
.u .hp i{background:var(--heal)}
.u.en .hp i{background:var(--enemy)}
.u .gauge{height:3px;margin-top:4px}
.u .gauge i{background:var(--gold-dim)}
.u .nums{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;min-height:18px}
.chip{font-size:.66rem;padding:0 6px;border-radius:3px;background:#0c0e15;color:var(--muted);letter-spacing:.04em}
.chip.frost{color:var(--frost)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.gold{color:var(--gold)} .chip.good{color:var(--heal)} .chip.spark{color:var(--spark)}
.u.en{cursor:pointer}
.u.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.u.wind{border-color:var(--warn)}
.u.frozen{border-color:var(--frost)}
.u.dead{opacity:.28}
.u.down{border-color:var(--bad)}
.u.lost{opacity:.35;filter:grayscale(1)}
.u.flash{box-shadow:0 0 0 2px var(--spark) inset}
.u.leader .un::after{content:"指揮";font-size:.62rem;color:var(--bg);background:var(--gold);padding:0 5px;border-radius:2px;font-weight:700;margin-left:auto}
.pop{position:absolute;right:8px;top:4px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;pointer-events:none;animation:rise .7s ease-out forwards}
.pop.dmg{color:var(--enemy)} .pop.heal{color:var(--heal)} .pop.crit{color:var(--gold);font-size:1rem}
@keyframes rise{from{transform:translateY(4px);opacity:1}to{transform:translateY(-10px);opacity:0}}
.oracle{margin-top:16px;background:var(--panel2);border:1px solid var(--gold-dim);border-radius:6px;padding:12px}
.divine{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--gold);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.divine .bar{flex:1;height:8px}
.obtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
@media (max-width:520px){.obtns{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ob{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 4px;display:flex;flex-direction:column;align-items:center}
.ob b{font-family:var(--f-display);font-size:1.15rem;font-weight:800;letter-spacing:.08em}
.ob small{font-size:.66rem;color:var(--muted)}
.ob:hover:not(:disabled){border-color:var(--gold)}
.ob:disabled{opacity:.35;cursor:not-allowed}
.pending{min-height:1.6em;font-size:.8rem;color:var(--gold);margin-top:8px}
.hint{font-size:.74rem;color:var(--muted);margin-top:4px}
.chron{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.log{height:560px;overflow-y:auto;font-size:.8rem;display:flex;flex-direction:column;gap:3px;padding-right:4px}
@media (max-width:900px){.log{height:300px}}
.ln{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:6px}
.ln .ts{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.7rem;padding-top:2px}
.ln.say .tx{color:#d8d1bd}
.ln.say b{color:var(--fg);font-family:var(--f-display)}
.ln.oracle .tx{color:var(--gold);font-family:var(--f-display);font-weight:600}
.ln.combo .tx{color:var(--gold);font-weight:700}
.ln.warn .tx{color:var(--warn);font-weight:700}
.ln.bad .tx{color:var(--bad);font-weight:700}
.ln.good .tx{color:var(--heal)}
.ln.miss .tx{color:var(--muted);font-style:italic}
.ln.disc .tx{color:var(--frost);font-weight:700}
.ln.flash .tx{color:var(--spark);font-weight:700;font-family:var(--f-display)}
.ln.sys .tx{color:var(--muted)}
.ln.skill .tx{color:#cfc8b6}
/* ---------- 結果 ---------- */
.verdict{font-family:var(--f-display);font-weight:800;font-size:2.2rem;letter-spacing:.2em;margin:4px 0}
.verdict.win{color:var(--gold)} .verdict.retreat{color:var(--frost)} .verdict.wipe{color:var(--bad)}
.report{font-family:var(--f-display);font-size:1.05rem;max-width:60ch;margin:6px 0 18px}
table{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:.74rem;letter-spacing:.08em}
.up{color:var(--heal)} .dn{color:var(--bad)}
.tw{overflow-x:auto}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:.82rem;color:var(--warn);flex-wrap:wrap}
/* ---------- 世界（布教地図・権能・酒場） ---------- */
.wmap{width:100%;height:auto;display:block;background:#0c0e15;border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
.wmap text{font-family:var(--f-body);font-size:8px}
.pw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:820px){.pw{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pwn{border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:.76rem;margin-bottom:6px;color:var(--muted)}
.pwn b{display:block;font-size:.86rem;color:var(--fg)}
.pwn.on{border-color:var(--gold);background:rgba(226,189,100,.08)}
.pwn.on b{color:var(--gold)}
.pwn.can{border-color:var(--gold-dim)}
.rum{padding-left:1.1em;margin:4px 0}
.rum li{font-size:.84rem;margin-bottom:6px}
.rum .who{display:block;color:var(--muted);font-size:.7rem}
.resv{display:flex;flex-direction:column;gap:6px}
.rv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.rv:last-child{border-bottom:0}
.rv .cond{flex-basis:100%}
/* ---------- 神殿のタブと、下に固定した旅立ちの帯 ---------- */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.ptabs button{background:none;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;padding:8px 18px;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:.08em;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.ptabs button small{font-family:var(--f-body);font-weight:500;font-size:.68rem;color:var(--gold-dim)}
.ptabs button.on{color:var(--gold);border-color:var(--line);background:var(--panel);margin-bottom:-1px}
.ptabs button:hover:not(.on){color:var(--fg)}
.dock{position:sticky;bottom:0;z-index:5;margin-top:22px;padding:12px 14px;background:rgba(16,18,27,.96);border-top:1px solid var(--gold-dim);backdrop-filter:blur(4px)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.mrow{display:flex;gap:10px;align-items:baseline;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:.8rem;color:var(--muted);text-align:left}
.mrow b{color:var(--fg);font-family:var(--f-display);font-size:.95rem}
.mrow:hover{border-color:var(--gold-dim)}
@media (prefers-reduced-motion:reduce){.alert.on,.pop{animation:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark">✶</span>神託の迷宮<small>戦闘試作 v0.3</small></div>
    <div class="steps" id="steps"><span data-s="prep">神殿</span><span data-s="battle">潜行</span><span data-s="result">帰還</span></div>
  </header>
  <main id="view"></main>
</div>

<script>
"use strict";
/* ============ データ ============ */
const ROLE_ORDER=['sword','tank','mage','hunter','priest'];
const ROLES={sword:'剣士',tank:'重騎士',mage:'魔術師',hunter:'狩人',priest:'神官',thief:'盗賊'};
const ROLE_LINE={sword:'剣',tank:'盾',mage:'魔',hunter:'弓',priest:'祈',thief:'短'};
const BASE_SKILL={sword:'slash',tank:'bash',mage:'fire',hunter:'shot',priest:'cure',thief:'stab'};
/* 基本職は6つ。パーティの枠は5つで、狩人の枠には盗賊も入れる（遊撃の枠） */
const BASE_JOBS=ROLE_ORDER.concat(['thief']);
const SLOT_OK={hunter:['hunter','thief']};
const slotRoles=r=>SLOT_OK[r]||[r];
const slotOf=role=>role==='thief'?'hunter':role;
const SLOTN={sword:'剣士',tank:'重騎士',mage:'魔術師',hunter:'狩人・盗賊',priest:'神官'};
const PERS=['慎重','豪胆','皮肉屋','寡黙','敬虔'];
const JOB_BASE={sword:{hp:120,atk:14,spd:1,def:.05},tank:{hp:190,atk:9,spd:.75,def:.28},mage:{hp:72,atk:7,spd:.9,def:0},hunter:{hp:82,atk:10,spd:1.2,def:.03},priest:{hp:84,atk:5,spd:1,def:0},thief:{hp:85,atk:11,spd:1.3,def:.03}};
const JOB_APT={sword:['剣','盾'],tank:['盾','剣'],mage:['魔','祈'],hunter:['弓','剣'],priest:['祈','魔'],thief:['短','弓']};
const CHAR_DB={
  gareth:{name:'ガレス',role:'sword',apt:['剣','盾'],age:27,pers:'慎重',hp:120,atk:14,spd:1.0,def:0.05,faith:60,

  $('#view').innerHTML=`<section class="battle"><div>
    <div class="bhead"><div class="wave" id="wave"></div><div class="clock" id="clock"></div>

const fmt=t=>{const s=Math.floor(t);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
function log(html,cls){const el=$('#log');if(!el)return;const d=document.createElement('div');d.className='ln '+(cls||'');
  d.innerHTML=`<span class="ts">${fmt(B.t)}</span><span class="tx">${html}</span>`;el.appendChild(d);el.scrollTop=el.scrollHeight;}
function say(u,text,cls){if(u)log(`<b>${u.name}</b>「${text}」`,cls||'say');}
function ev(d,fn){B.events.push({at:B.t+d,fn});}
const okU=()=>B.units.filter(u=>u.state==='ok');
const okE=()=>B.enemies.filter(e=>e.state==='ok');
const byRole=r=>B.units.find(u=>u.role===r);
const ready=u=>u&&u.state==='ok'&&u.busy<=0;
const patk=u=>u.atk*(B.blessAtk>0?1.25:1)*(hasAb(u,'haisui')&&u.hp/u.max<.3?1.5:1);
function getLeader(){const s=byRole('sword');if(s&&s.state==='ok')return s;return okU().sort((a,b)=>S.faith[b.id]-S.faith[a.id])[0]||null;}
function addFaith(id,d){S.faith[id]=clamp(S.faith[id]+damp(S.faith[id],d),0,100);}
function popOn(x,v,cls){x.pop={v:typeof v==='number'?Math.round(v):v,cls,t:B.t};}

/* --- 被ダメージ・与ダメージ --- */
function dmgEnemy(e,dmg,src,crit){
  if(!e||e.state!=='ok')return;
  if(src&&src.side==='p'&&hasAb(src,'sniper')&&(e.frozen>0||e.stun>0))dmg*=1.4;
  if(e.stun>0)dmg*=1.5;
  if(src&&src.side==='p'){
    if(hasAb(src,'enchant')&&Math.random()<.2&&e.hp>dmg){e.frozen=Math.max(e.frozen,1.5);}
    if(hasAb(src,'seikou'))heal(src,src,src.max*.03);
    if(hasAb(src,'kyuumei'))heal(src,src,dmg*.15);
    trySteal(src,e);
  }
  e.hp-=dmg; popOn(e,dmg,crit?'crit':'dmg');
  if(e.hp<=0){e.hp=0;e.state='dead';e.wind=0;if(B.selected===e.id)B.selected=null;
    if(e.kind==='traitor'){const f=okU().sort((a,b)=>relOf(b.id,e.tid)-relOf(a.id,e.tid))[0];const best=f?relOf(f.id,e.tid):-100;const nm=CHAR_DB[e.tid].name;
      if(f&&Math.random()<0.35+best/100){say(f,`戻ってこい、${nm}。まだ間に合う`);log(`${nm}は剣を下ろした。一行に戻る`,'good');B.reclaimed.push(e.tid);}
      else{log(`${nm}は膝をついたが、手を振り払って姿を消した`,'sys');}}
    else log(`${e.name}を倒した`,'sys');}
}
function hitParty(u,dmg,sweep,src){
  if(u.state!=='ok')return;
  if(src&&u.parry>0&&src.state==='ok'&&hasStyle(u,'kaeshi')&&B.t-(u.counterT||-9)>1){u.counterT=B.t;triggerStyle(u,'kaeshi');dmgEnemy(src,patk(u)*1.3,u);}
  if((hasAb(u,'mikiri')&&Math.random()<.2)||(hasAb(u,'kagebashiri')&&Math.random()<.1)){popOn(u,'かわした','heal');return;}
  if(!sweep&&u.hp/u.max<.3&&!u._cov){const cv=okU().find(x=>x!==u&&hasAb(x,'kabau')&&x.hp/x.max>.4);
    if(cv){dmg*=.5;cv._cov=true;hitParty(cv,dmg,false,null);cv._cov=false;if(Math.random()<.4)log(`${cv.name}が${u.name}をかばった`,'sys');
      if(hasStyle(cv,'kenshin')){heal(cv,u,22);triggerStyle(cv,'kenshin');}}}
  let f=1-u.def; if(B.guardT>0)f*=sweep?0.35:0.6; if(u.parry>0)f*=0.5;
  dmg*=f; u.hp-=dmg; popOn(u,dmg,'dmg');
  if(u.hp<=0)knockDown(u);
}
function knockDown(u){
  u.downs=(u.downs||0)+1;
  u.hp=0;u.state='down';u.down=(hasAb(u,'fukutsu')?16:10)+(hasP('g2')?3:0);u.busy=0;u.taunt=0;
  log(`${u.name}が倒れた！ 救命の猶予は${u.down}秒`,'bad'); say(u,DOWN_L[u.pers]);
}
function makeMemento(id){
  const best=(S.skills[id]||[]).filter(s=>s.src==='flash'||s.src==='teach').sort((a,b)=>b.st-a.st)[0];
  const name=`${CHAR_DB[id].name}の形見`;
  const grant=best?{k:best.k,st:2}:null;
  return addItem(S,'memento',{name,grant,txt:'閃き+30%'+(grant?`・【${SKILLS[grant.k].name}】が宿る（系統が合えば訓練段階で使える）`:'')});
}
function loseUnit(u,quiet){
  u.state='lost'; S.lost.push(u.id); B.lostNow.push(u.id);
  for(const r of ROLE_ORDER)if(S.party[r]===u.id){S.party[r]=null;S.vacated[r]=u.id;}
  // 遺言：同じ戦場にいる弟子へ
  const heirs=B.units.filter(o=>o!==u&&o.state!=='lost'&&S.master[o.id]===u.id);
  let heirTxt='';
  for(const o of heirs){
    const t=teachable(u.id,o.id);
    if(!quiet)say(u,`${o.name}……${WILL_L[u.pers]}`);
    if(t){const e=learn(o.id,t.k,t.st,'teach');if(o.state!=='lost')o.skills.push(e);
      log(`✧ ${o.name}は師${u.name}の【${SKILLS[t.k].name}】を受け継いだ（${STAGE[t.st]}）`,'flash');B.wills.push({from:u.id,to:o.id,k:t.k,st:t.st});heirTxt=`弟子${o.name}が【${SKILLS[t.k].name}】を継いだ`;}
    delete S.master[o.id];delete S.teach[o.id];
  }
  delete S.master[u.id];delete S.teach[u.id];
  // 装備：形見と共に神殿へ戻る
  const eq=S.equip[u.id]||{};delete S.equip[u.id];
  if(quiet){for(const v of Object.values(eq))if(v)delete S.items[v];}
  else{const m=makeMemento(u.id);B.loot.push(m);}
  S.graves.push({name:u.name,role:ROLES[u.role],wish:CHAR_DB[u.id].wish,heir:heirTxt});
  if(!quiet){
    log(`${u.name}の命の灯が消えた。`,'bad');
    for(const o of B.units)if(o!==u&&o.state!=='lost')addFaith(o.id,o.pers==='敬虔'?-2:-6);
    const Ld=getLeader();
    for(const o of B.units)if(o!==u&&o.state!=='lost'&&relOf(o.id,u.id)>=40){addLoyal(o.id,-8);if(Ld&&Ld!==o)addRel(o.id,Ld.id,-6);B.relNotes.push(`${o.name}は${u.name}を守れなかった指揮を恨んでいる`);}
    const w=okU(); if(w.length){const r=pick(w);say(r,LOST_R[r.pers]);}
  }
  persist();
}
function heal(p,t,amt){if(t.state!=='ok')return;if(p&&p.side==='p'&&hasAb(p,'kusushi'))amt*=1.3;const a=Math.min(amt,t.max-t.hp);t.hp+=a;popOn(t,a,'heal');}

/* --- 目標選択 --- */
function partyTarget(){
  const es=okE(); if(!es.length)return null;
  if(B.focusT>0){const f=es.find(e=>e.id===B.focus);if(f)return f;}
  const pol=S.policy.target;
  if(pol==='caster'){const c=es.find(e=>ENEMY_DB[e.kind].caster);if(c)return c;}
  if(pol==='strong')return es.slice().sort((a,b)=>b.max-a.max)[0];
  return es.slice().sort((a,b)=>a.hp-b.hp)[0];
}
function enemyTarget(ignoreTaunt){
  const us=okU(); if(!us.length)return null;
  if(!ignoreTaunt){const t=us.find(u=>u.taunt>0);if(t)return t;}
  const w=us.map(u=>(u.role==='sword'||u.role==='tank')?3:u.role==='thief'?0.7:1); let s=w.reduce((a,b)=>a+b,0)*Math.random();
  for(let i=0;i<us.length;i++){s-=w[i];if(s<=0)return us[i];}
  return us[0];
}

/* --- 閃き・習熟 --- */
function gainExp(u,s,amt){
  if(s.temp)return; const cap=skillCap(s); if(s.st>=cap)return;
  s.exp+=amt;
  if(s.exp>=EXP_NEED[s.st]){s.st++;s.exp=0;B.ups.push({id:u.id,k:s.k,st:s.st});log(`${u.name}の【${SKILLS[s.k].name}】が「${STAGE[s.st]}」の段階に達した`,'combo');}
}
function sparkCheck(u,usedK,tg){
  if(u.state!=='ok')return;
  const apt=aptOf(u.id);
  const kids=Object.keys(SKILLS).filter(k=>SKILLS[k].from===usedK&&apt.includes(SKILLS[k].line)&&!knows(u.id,k)&&(!SKILLS[k].cls||S.cls[u.id]===SKILLS[k].cls));
  const eyes=(S.skills[u.id]||[]).filter(s=>s.k===usedK&&s.src==='book'&&s.st===3&&!s.eye);
  if(!kids.length&&!eyes.length)return;
  const em=tg?ENEMY_DB[tg.kind].flash*(tg.fmul||1):1;
  const mult=em*(B.graceT>0?2.2:1)*(0.5+S.faith[u.id]/100)*(1+u.flashB);
  S.spark[u.id]=Math.min(100,(S.spark[u.id]||0)+2*mult*rnd(.5,1.5));
  const m=S.spark[u.id];
  if(!(m>=100||(m>=60&&Math.random()<0.12)))return;
  S.spark[u.id]=0; u.flashT=B.t;
  if(eyes.length&&(!kids.length||Math.random()<0.5)){
    const s=eyes[0];s.eye=true;s.st=4;s.exp=0;
    say(u,FLASH_L[u.pers],'flash');log(`✧ ${u.name}は【${SKILLS[s.k].name}】の真髄に開眼した（体得）`,'flash');
    B.flashes.push({id:u.id,k:s.k,type:'eye',grace:B.graceT>0});return;
  }
  const k=pick(kids); const ent=learn(u.id,k,3,'flash'); u.skills.push(ent);
  say(u,FLASH_L[u.pers],'flash'); log(`✧ ${u.name}は閃いた！【${SKILLS[k].name}】`,'flash');
  B.flashes.push({id:u.id,k,type:'flash',grace:B.graceT>0});
  if(B.graceT>0)addFaith(u.id,3);
  doSkill(u,ent,tg&&tg.state==='ok'?tg:partyTarget(),true);
}

/* --- 習得した技 --- */
function wants(u,k,tg){
  switch(k){
    case 'parry':return u.hp/u.max<0.75;
    case 'wall':return okU().some(x=>x.hp/x.max<0.6)||okE().some(e=>e.wind>0);
    case 'bless':return B.blessAtk<=0&&okE().length>0;
    case 'wind':return okU().filter(x=>x.hp/x.max<0.7).length>=2;
    case 'kiseki':return B.units.some(x=>x.state==='down');
    case 'furaku':return okE().some(e=>e.wind>0)||okU().filter(x=>x.hp/x.max<0.5).length>=2;
    case 'seijun':return u.hp/u.max<0.8;
    case 'sutemi':return !!tg&&u.hp/u.max>0.4;
    default:return !!tg;
  }
}
function useLearned(u,tg){
  const avail=u.skills.filter(s=>!SKILLS[s.k].base&&(u.scd[s.k]||0)<=0&&wants(u,s.k,tg));
  if(!avail.length)return false;
  const w=okE().find(e=>e.wind>0);
  if(w){const s=avail.find(s=>s.k==='bigbash'||s.k==='shadow');if(s&&Math.random()<0.35+0.12*s.st)return doSkill(u,s,w);}
  for(const s of shuffle(avail))if(Math.random()<USE[s.st])return doSkill(u,s,tg);
  return false;
}
function doSkill(u,s,tg,forced){
  const sk=SKILLS[s.k];
  const SELF=['parry','wall','bless','wind','furaku','seijun','kiseki'],ALL=SELF.concat(['blast','tenrai','tensen','oboro']);
  if(!ALL.includes(s.k)&&(!tg||tg.state!=='ok'))tg=partyTarget();
  if(!tg&&!SELF.includes(s.k))return false;
  u.scd[s.k]=(sk.cd||8)*(hasAb(u,'quick')?.75:1);
  if(!forced&&Math.random()>SUCC[s.st]){log(`${u.name}の【${sk.name}】……型が崩れた`,'miss');gainExp(u,s,0.5);return true;}
  let p=POW[s.st]; const a=patk(u); let note='';if(MULTI.includes(s.k)&&hasAb(u,'rengeki'))p*=1.3;
  switch(s.k){
    case 'parry':u.parry=4;break;
    case 'double':dmgEnemy(tg,a*1.9*p,u);if(hasStyle(u,'hyoujin')&&tg.state==='ok'){tg.frozen=Math.max(tg.frozen,2);triggerStyle(u,'hyoujin');}if(hasStyle(u,'tsubamek')&&(u.scd.tsubame||0)>0){u.scd.tsubame/=2;triggerStyle(u,'tsubamek');}break;
    case 'tsubame':dmgEnemy(tg,a*3.2*p,u,true);break;
    case 'wall':if(B.guardT<=0)guardStart();B.guardT=Math.max(B.guardT,3);note='全員の守りが固まった';if(hasStyle(u,'seiki')){for(const x of okU())heal(u,x,14);triggerStyle(u,'seiki');}break;
    case 'bigbash':{if(tg.wind>0){tg.wind=0;note=`${tg.name}の大技を止めた！`;if(B.alert&&B.alert.id===tg.id)B.alert=null;}let st=1.5;if(B.guardT>0&&hasStyle(u,'fudou')){st=3;triggerStyle(u,'fudou');}tg.stun=Math.max(tg.stun,st);dmgEnemy(tg,a*2*p,u);break;}
    case 'thunder':{let d=a*3*p;if(tg.frozen>0){d*=2;tg.frozen=0;note='氷ごと砕けた！';if(!S.discovered.shatter)discover('shatter');}
      if(tg.burnT&&B.t-tg.burnT<3&&hasStyle(u,'rakurai')){triggerStyle(u,'rakurai');for(const e of okE())if(e!==tg)dmgEnemy(e,a*1.2*p,u);}
      dmgEnemy(tg,d,u,d>a*4);break;}
    case 'blast':for(const e of okE()){e.burnT=B.t;dmgEnemy(e,a*1.6*p,u);}break;
    case 'aim':{let d=a*2.2*p;const stopped=tg.stun>0||tg.frozen>0;if(stopped&&hasStyle(u,'karyudo')){d*=1.6;triggerStyle(u,'karyudo');}dmgEnemy(tg,d,u,stopped);break;}
    case 'shadow':if(tg.wind>0){tg.wind=0;note=`${tg.name}の大技を縫い止めた！`;if(B.alert&&B.alert.id===tg.id)B.alert=null;}tg.stun=Math.max(tg.stun,2);dmgEnemy(tg,a*p,u);break;
    case 'bless':B.blessAtk=6;note='全員の攻撃に力が宿る';break;
    case 'wind':{let m=1;if(B.blessAtk>0&&hasStyle(u,'jiu')){m=1.5;triggerStyle(u,'jiu');}for(const x of okU())heal(u,x,20*p*m*(1+u.healB));break;}
    case 'mumyo':{const st=tg.stun;tg.stun=0;dmgEnemy(tg,a*5*p,u,true);tg.stun=st;note='一閃';break;}
    case 'sutemi':dmgEnemy(tg,a*3*p,u,true);if(hasStyle(u,'gekirin')&&u.hp/u.max<.3)triggerStyle(u,'gekirin');else u.hp=Math.max(1,u.hp-u.max*0.1);break;
    case 'furaku':if(B.guardT<=0)guardStart();B.guardT=Math.max(B.guardT,5);note='誰も倒れさせない構え';break;
    case 'seijun':u.taunt=6;heal(u,u,u.max*0.18*p);note='敵の注意を集め、傷が癒える';break;
    case 'tenrai':for(const e of okE()){let d=a*1.8*p;if(e.frozen>0){d*=2;e.frozen=0;}dmgEnemy(e,d,u);}break;
    case 'jubaku':tg.gauge=0;if(tg.wind>0){tg.wind=0;note=`${tg.name}の大技を封じた！`;if(B.alert&&B.alert.id===tg.id)B.alert=null;}dmgEnemy(tg,a*p,u);break;
    case 'tensen':for(const e of okE())dmgEnemy(e,a*2*p,u);break;
    case 'oboro':for(const e of okE()){e.stun=Math.max(e.stun,1.5);if(e.wind>0){e.wind=0;if(B.alert&&B.alert.id===e.id)B.alert=null;}}note='敵が影に縫い止められた';break;
    case 'nage':{const ts=[tg].concat(okE().filter(e=>e!==tg).slice(0,1));for(const e of ts)dmgEnemy(e,a*1.4*p,u);break;}
    case 'kyusho':{const stp=tg.stun>0||tg.frozen>0;dmgEnemy(tg,a*2.4*p*(stp?1.6:1),u,stp);if(stp)note='急所を貫いた';break;}
    case 'kiseki':for(const x of B.units)if(x.state==='down'){x.state='ok';x.hp=x.max*0.4;x.down=0;popOn(x,x.hp,'heal');}note='倒れた仲間が立ち上がる';break;
  }
  const tgt=(ALL.includes(s.k)||!tg)?'':`→${tg.name}`;
  log(`${u.name}の【${sk.name}】${tgt}${note?'　'+note:''}`,note?'combo':'skill');
  gainExp(u,s,1); sparkCheck(u,s.k,tg);
  if(!forced&&sk.line==='魔'&&hasAb(u,'nijuu')&&Math.random()<.25){const t2=tg&&tg.state==='ok'?tg:partyTarget();if(t2||!tg){log(`${u.name}の二重詠唱！`,'combo');doSkill(u,s,t2,true);}}
  return true;
}

/* --- 連携技・職の技 --- */
function doTaunt(T){T.taunt=6;T.cd.taunt=hasAb(T,'quick')?7.5:10;log(`${T.name}の挑発！ 敵の注意を引きつけた`,'sys');}
function mist(M,dur,partial){
  for(const e of okE()){if(partial&&Math.random()<0.5)continue;e.frozen=Math.max(e.frozen,dur+M.frost);dmgEnemy(e,6,M);}
  log(partial?`${M.name}の凍結の霧。霧が薄く、凍らない敵がいる`:`${M.name}の凍結の霧！ 敵が凍りついた`,partial?'miss':'sys');
  M.cd.mist=hasAb(M,'quick')?10.5:14;
  const th=M.skills&&M.skills.find(x=>x.k==='thunder');
  if(th&&hasStyle(M,'hyourai')&&(M.scd.thunder||0)<=0)ev(0.45,()=>{if(M.state!=='ok')return;const t=okE().find(e=>e.frozen>0);if(!t)return;triggerStyle(M,'hyourai');doSkill(M,th,t,true);});
}
function pierce(H,count){
  const ts=okE().sort((a,b)=>(b.frozen>0)-(a.frozen>0)).slice(0,count);
  let crit=0;
  for(const e of ts){let d=patk(H)*1.3*rnd(.9,1.1);const c=e.frozen>0;if(c){d*=3;crit++;}dmgEnemy(e,d,H,c);}
  log(`${H.name}の貫通矢${crit?`、凍った敵${crit}体の急所を射抜いた！`:'。'}`,crit?'combo':'sys');
  if(crit&&!S.discovered.frost)discover('frost');
  H.cd.pierce=hasAb(H,'quick')?7.5:10;
}
function discover(k){S.discovered[k]=true;B.disc.push(k);log(`✶ 神の知識に記された：${KNOW[k].t}`,'disc');persist();}
function bump(c){const k=mkey(c);const o=S.mastery[k]||0;if(o<4){S.mastery[k]=o+1;B.mast.push({c,from:o,to:o+1});log(`【${COMBOS[c].name}】の習熟が深まった（${o}→${o+1}/4）`,'combo');}persist();}
function cageReady(minE){
  const T=byRole('tank'),M=byRole('mage'),H=byRole('hunter');
  return ready(T)&&ready(M)&&ready(H)&&T.cd.taunt<=0&&M.cd.mist<=0&&H.cd.pierce<=0&&okE().length>=minE&&B.comboLock<=0;
}
function cageReserved(){
  const m=getM('cage');const need=S.policy.combo==='aggressive'?1:3;
  const T=byRole('tank'),M=byRole('mage'),H=byRole('hunter');
  return m>=need&&[T,M,H].every(u=>u&&u.state==='ok')&&okE().length>=3;
}
function execCage(bonus,byOracle){
  const T=byRole('tank'),M=byRole('mage'),H=byRole('hunter');const m=getM('cage');
  const rebel=[T,M,H].find(u=>S.loyal[u.id]<30&&Math.random()<0.35);
  if(rebel){B.comboLock=3;say(rebel,'……悪いが、自分のやり方でやる');log('連携が揃わなかった（忠誠が低い）','miss');B.relNotes.push(`${rebel.name}が連携を拒んだ`);return;}
  bonus+=pairBonus([T,M,H]);
  T.busy=M.busy=H.busy=1.8;B.comboLock=2.4;
  const L=getLeader(); if(L&&!byOracle)say(L,`「檻」をやるぞ！ ${T.name}、引きつけろ！`);
  log('連携技【鉄壁の檻】','combo');
  doTaunt(T);
  let ok1=false;
  ev(0.7,()=>{if(M.state!=='ok'){log('詠唱役が倒れ、連携が途切れた','miss');return;}
    ok1=Math.random()<clamp(.5+.12*m+bonus,0,.97);mist(M,ok1?4:2,!ok1);});
  ev(1.4,()=>{if(H.state!=='ok'){log('射手が倒れ、連携が途切れた','miss');return;}
    const ok2=Math.random()<clamp(.55+.12*m+bonus,0,.97);
    if(!ok2)log(`${H.name}の矢が一拍遅れた`,'miss');
    pierce(H,ok2?3:1);
    if(ok1&&ok2){B.combos.ok++;log('✦ 鉄壁の檻、成功','combo');bump('cage');[T,M,H].forEach(u=>addFaith(u.id,2));addRel(T.id,M.id,4);addRel(T.id,H.id,4);addRel(M.id,H.id,4);if(byOracle&&L)addFaith(L.id,3);}
    else{B.combos.fail++;log('鉄壁の檻は不完全に終わった','miss');}});
}
function execBreak(e,bonus,byOracle,improvise){
  const T=byRole('tank'),W=byRole('sword');const m=getM('brk');if(W)bonus+=pairBonus([T,W]);
  T.busy=1.2;if(ready(W))W.busy=1.6;B.comboLock=1.6;
  const L=getLeader();
  if(improvise)say(T,'振りかぶりの隙……今なら崩せる！');
  else{if(L&&!byOracle)say(L,`「崩し」だ！ ${T.name}、出端を叩け！`);log('連携技【崩し】','combo');}
  ev(0.25,()=>{
    if(T.state!=='ok'||e.state!=='ok')return;
    const p=improvise?0.55:clamp(.45+.13*m+bonus,0,.95);
    if(Math.random()<p){
      e.wind=0;e.stun=3.5;B.alert=null;
      log(`${T.name}の盾撃が${e.name}の出端を崩した！ 体勢が崩れている`,'combo');dmgEnemy(e,T.atk,T);
      if(!S.discovered.brk){discover('brk');S.mastery[mkey('brk')]=1;B.mast.push({c:'brk',from:0,to:1});}
      if(W&&W.state==='ok')ev(0.6,()=>{if(e.state!=='ok'||W.state!=='ok')return;dmgEnemy(e,patk(W)*4*rnd(.95,1.1),W,true);
        log(`${W.name}の渾身の追撃！`,'combo');
        if(!improvise){B.combos.ok++;log('✦ 崩し、成功','combo');bump('brk');addRel(T.id,W.id,4);addFaith(T.id,2);addFaith(W.id,2);if(byOracle&&L)addFaith(L.id,3);}});
    }else{B.combos.fail++;log(`${T.name}の盾が弾かれた！ ${e.name}の構えは崩れない`,'miss');}
  });
}

/* --- パーティの行動 --- */
function actParty(u){
  const tg=partyTarget(); const R=cageReserved();
  if(u.role==='priest'){
    const downs=B.units.filter(x=>x.state==='down').sort((a,b)=>a.down-b.down);
    const th=+S.policy.heal/100;
    const low=okU().filter(x=>x.hp/x.max<th).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];
    const rescueFirst=S.policy.rescue==='first'||B.saveOrder>0;
    if(downs.length&&(rescueFirst||!low)){rescue(u,downs[0]);return;}
    if(useLearned(u,tg))return;
    if(low){heal(u,low,38*(1+u.healB));if(low.hp/low.max<0.25)log(`${u.name}の治癒が${low.name}を支えた`,'good');sparkCheck(u,'cure',partyTarget());return;}
    if(tg)dmgEnemy(tg,patk(u)*1.5,u);return;
  }
  if(u.role==='tank'){
    const w=okE().find(e=>e.wind>0);
    if(w&&Math.random()<0.4&&B.comboLock<=0&&!u.skills.some(s=>s.k==='bigbash')){execBreak(w,0,false,!S.discovered.brk);return;}
    if(u.cd.taunt<=0&&!R&&okE().length>=2&&Math.random()<0.6){doTaunt(u);return;}
    if(useLearned(u,tg))return;
    if(tg){dmgEnemy(tg,patk(u)*rnd(.9,1.1),u);sparkCheck(u,'bash',tg);}return;
  }
  if(useLearned(u,tg))return;
  if(u.role==='sword'){if(tg){dmgEnemy(tg,patk(u)*rnd(.9,1.15),u);sparkCheck(u,'slash',tg);}return;}
  if(u.role==='mage'){
    if(u.cd.mist<=0&&!R&&okE().length>=3&&Math.random()<0.35){mist(u,3.5,false);return;}
    if(tg){dmgEnemy(tg,patk(u)*2.6*rnd(.9,1.1),u);sparkCheck(u,'fire',tg);}return;
  }
  if(u.role==='hunter'){
    if(u.cd.pierce<=0&&!R&&Math.random()<0.45){pierce(u,3);return;}
    if(tg){dmgEnemy(tg,patk(u)*rnd(.9,1.1),u);sparkCheck(u,'shot',tg);}return;
  }
  if(u.role==='thief'){
    // 手数が多いぶん、閃きの兆しは2回に1回だけ溜まる
    if(tg){const stp=tg.stun>0||tg.frozen>0;dmgEnemy(tg,patk(u)*rnd(.9,1.15)*(stp?1.5:1),u,stp);if(Math.random()<.5)sparkCheck(u,'stab',tg);}return;
  }
}
function rescue(p,t){
  const ct=hasAb(p,'jihi')?.8:1.5;p.busy=ct; log(`${p.name}が${t.name}のために救命の祈りを唱え始めた`,'good');
  const ordered=B.saveOrder>0;
  ev(ct,()=>{if(p.state!=='ok'||t.state!=='down')return;t.state='ok';t.hp=t.max*0.35;t.down=0;popOn(t,t.hp,'heal');
    log(`祈りが届いた。${t.name}が立ち上がる`,'good');addRel(p.id,t.id,8);
    if(ordered){addFaith(t.id,4);addFaith(p.id,2);say(t,t.pers==='皮肉屋'?'……借りができたわね、神様':'神よ……感謝する');}});
}

/* --- 敵の行動 --- */
function actEnemy(e){
  if(e.kind==='traitor'){const t=enemyTarget(Math.random()<0.5);if(t){hitParty(t,e.atk*rnd(.9,1.15),false,e);if(Math.random()<0.25)log(`${e.name}の一撃が${t.name}を捉えた`,'sys');}return;}
  if(MELEE_E.includes(e.kind)){const t=enemyTarget(false);if(t)hitParty(t,e.atk*rnd(.85,1.15),false,e);return;}
  if(e.kind==='shaman'){
    const hurt=okE().find(x=>x.kind==='goblin'&&x.hp/x.max<0.5);
    if(hurt&&Math.random()<0.6){heal(e,hurt,22);log(`${e.name}が${hurt.name}の傷を癒やした`,'sys');return;}
    const back=okU().filter(u=>u.role!=='tank'&&u.role!=='sword').sort((a,b)=>a.hp-b.hp)[0]||enemyTarget(true);
    if(back){hitParty(back,e.atk*rnd(.9,1.1));log(`${e.name}の闇の矢が${back.name}を貫いた`,'sys');}
    return;
  }
  if(BIG_E.includes(e.kind)){
    e.cycle++;
    if(e.cycle%3===0){e.wind=2.6;B.alert={text:`${e.name}が棍棒を大きく振りかぶった！`,id:e.id};log(`${e.name}が棍棒を大きく振りかぶった！`,'warn');return;}
    const t=enemyTarget(false);if(t)hitParty(t,e.atk*rnd(.9,1.1),false,e);
  }
}
function sweep(e){
  B.alert=null;
  const guarded=B.guardT>0;
  log(`${e.name}の薙ぎ払い！${guarded?' 守りの構えが衝撃を受け止めた':''}`,guarded?'good':'warn');
  for(const u of okU())hitParty(u,62*(e.amul||1)*rnd(.95,1.05),true,e);
  if(guarded&&B.guardByOracle){log('神託の守りが、仲間を救った','oracle');for(const u of okU())addFaith(u.id,2);
    const last=B.oracles.filter(o=>o.k==='guard').pop();if(last)last.note='薙ぎ払いを防いだ';}
}

/* --- 神託 --- */
function issue(k){
  if(!B||B.over||B.pending)return;
  const o=ORACLES.find(x=>x.k===k); if(B.divine<costOf(o))return;
  if(!getLeader())return;
  B.divine-=costOf(o); B.pending={k,at:B.t+Math.max(.25,(apostleActive()?0.35:0.9)-(hasP('v1')?0.2:0)),target:B.selected};
  log(`神託「${o.w}」`,'oracle'); render();
}
function resolveOracle(){
  const {k,target}=B.pending; B.pending=null;
  const L=getLeader(); if(!L)return;
  const p=obeyRate(L.id); const r=Math.random();
  const res=r<p?'obey':(r<p+(1-p)*0.5?'partial':'ignore');
  const rec={t:B.t,k,leader:L.name,res,note:''}; B.oracles.push(rec);
  if(res==='ignore'){say(L,IGNORE[L.pers]);rec.note='聞き入れられなかった';return;}
  B.graceT=(res==='obey'?5:2.5)*(hasP('v3')?1.5:1);
  say(L,res==='obey'?OBEY[L.pers][k]:PARTIAL[k]);
  if(k==='guard'){if(B.guardT<=0)guardStart();B.guardT=res==='obey'?4.5:2;B.guardByOracle=true;const T=byRole('tank');if(res==='obey'&&ready(T)&&T.cd.taunt<=0)doTaunt(T);}
  if(k==='strike'){const t=okE().find(e=>e.id===target)||okE().slice().sort((a,b)=>b.max-a.max)[0];
    if(t){const f=res==='obey'?t:partyTarget();B.focus=f.id;B.focusT=res==='obey'?8:4;rec.note=`${f.name}を集中攻撃`;}}
  if(k==='save'){B.saveOrder=res==='obey'?6:3;const P=byRole('priest');
    if(!P||P.state!=='ok'){rec.note='神官が動けない';return;}
    const d=B.units.filter(x=>x.state==='down').sort((a,b)=>a.down-b.down)[0];
    if(d&&P.busy<=0){rescue(P,d);rec.note=`${d.name}の救命に入った`;}
    else if(!d){rec.note='倒れた仲間はいなかった';addFaith(L.id,-2);}}
  if(k==='retreat'){if(res==='obey'){rec.note='撤退した';endBattle('retreat');}else rec.note='撤退しなかった';}
  if(k==='now'){
    const bonus=res==='obey'?0.15:0;
    const w=okE().find(e=>e.wind>0);const T=byRole('tank');
    if(w&&ready(T)&&B.comboLock<=0){
      if(S.discovered.brk){execBreak(w,bonus,true,false);rec.note='「崩し」を仕掛けた';}
      else if(Math.random()<0.6){execBreak(w,0,true,true);rec.note='神託に促され、隙を突こうとした';}
      else{say(T,'今……？ 何をしろってんだ');rec.note='意図が伝わらなかった';}
    }else if(cageReady(2)&&getM('cage')>=1){execCage(bonus,true);rec.note='「鉄壁の檻」を仕掛けた';}
    else{log('仕掛けられる連携がない。神託は空を切った','miss');rec.note='仕掛けられる技がなかった（神の気配は満ちた）';addFaith(L.id,-2);}
  }
}

/* --- 進行 --- */
function tick(dt){
  B.t+=dt;
  const avg=okU().reduce((a,u)=>a+S.faith[u.id],0)/Math.max(1,okU().length);
  B.divine=Math.min(100,B.divine+dt*2.6*(avg/65)*(0.8+S.belief[BASE_TOWN]/250)*(hasP('b2')?1.2:1));
  B.guardT=Math.max(0,B.guardT-dt); if(B.guardT<=0)B.guardByOracle=false;
  B.focusT=Math.max(0,B.focusT-dt); B.saveOrder=Math.max(0,B.saveOrder-dt); B.comboLock=Math.max(0,B.comboLock-dt);
  B.graceT=Math.max(0,B.graceT-dt); B.blessAtk=Math.max(0,B.blessAtk-dt);
  for(const u of B.units){
    for(const c in u.cd)u.cd[c]=Math.max(0,u.cd[c]-dt);
    for(const c in u.scd)u.scd[c]=Math.max(0,u.scd[c]-dt);
    u.taunt=Math.max(0,u.taunt-dt); u.busy=Math.max(0,u.busy-dt); u.parry=Math.max(0,u.parry-dt);
    if(u.state==='down'){u.down-=dt;if(u.down<=0){
      if(hasP('g3')&&!B.lampUsed&&B.divine>=50){B.lampUsed=true;B.divine-=50;u.state='ok';u.hp=u.max*.3;u.down=0;popOn(u,u.hp,'heal');log(`✶ 蘇りの灯。消えかけた${u.name}の命を、あなたが引き戻した`,'oracle');addFaith(u.id,8);}
      else loseUnit(u,false);}}
  }
  for(const e of B.enemies){e.frozen=Math.max(0,e.frozen-dt);e.stun=Math.max(0,e.stun-dt);}
  const due=B.events.filter(x=>x.at<=B.t); B.events=B.events.filter(x=>x.at>B.t); due.forEach(x=>x.fn());
  if(B.over)return;
  if(B.pending&&B.t>=B.pending.at)resolveOracle();
  if(B.over)return;
  const L=getLeader();
  if(L&&L.id!==B.leaderId){B.leaderId=L.id;log(`指揮が${L.name}に移った`,'sys');}
  if(L){
    const w=okE().find(e=>e.wind>0&&e.wind<2.2&&e.frozen<=0);
    const T=byRole('tank');
    if(w&&S.discovered.brk&&ready(T)&&B.comboLock<=0){const m=getM('brk');const need=S.policy.combo==='aggressive'?2:3;
      if(m>=4||(m>=need&&Math.random()<1.5*dt))execBreak(w,0,false,false);}
    if(cageReady(3)){const m=getM('cage');const need=S.policy.combo==='aggressive'?1:3;
      if(m>=4||(m>=need&&Math.random()<0.5*dt))execCage(0,false);}
  }
  if(B.waveWait>0){B.waveWait-=dt;if(B.waveWait<=0){B.waveWait=0;const f=B.nextFn;B.nextFn=null;if(f)f();}}
  else{
    for(const u of B.units){if(u.state!=='ok'||u.busy>0)continue;u.gauge+=dt*u.spd/2.4;if(u.gauge>=1){u.gauge=0;actParty(u);}}
    for(const e of B.enemies){
      if(e.state!=='ok'||e.frozen>0||e.stun>0)continue;
      if(e.wind>0){e.wind-=dt;if(e.wind<=0){e.wind=0;sweep(e);}continue;}
      e.gauge+=dt*e.spd/2.6;if(e.gauge>=1){e.gauge=0;actEnemy(e);}
    }
  }
  if(B.over)return;
  const downs=B.units.filter(u=>u.state==='down').length;
  const pol=S.policy.retreat;
  if(okU().length&&((pol==='lost'&&B.lostNow.length)||(pol==='two'&&downs>=2))){
    say(getLeader(),'戒律に従う。撤退だ！');endBattle('retreat');return;}
  if(!okU().length){endBattle('wipe');return;}
  if(B.waveWait<=0&&!B.nextFn&&!okE().length){advance();if(B.over)return;}
  render();
}

/* --- 描画 --- */
function render(){
  if(!$('#party'))return;
  $('#wave').textContent=B.place+(B.wave?`・第${B.wave}波`:'');
  $('#clock').textContent=fmt(B.t);
  document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===B.speed));
  const al=$('#alert');const a=B.alert&&B.enemies.find(e=>e.id===B.alert.id&&e.state==='ok'&&e.wind>0);
  al.textContent=a?`！ ${B.alert.text}`:(B.graceT>0?`神の気配が満ちている（${B.graceT.toFixed(1)}秒・閃きやすい）`:(B.guardT>0?'守りの構え':''));al.classList.toggle('on',!!a);
  if(!a)B.alert=null;
  $('#enemies').innerHTML=B.enemies.map(e=>{
    const ch=[];if(e.wind>0)ch.push(`<span class="chip warn">振りかぶり ${e.wind.toFixed(1)}</span>`);
    if(e.frozen>0)ch.push(`<span class="chip frost">凍結 ${e.frozen.toFixed(1)}</span>`);
    if(e.stun>0)ch.push(`<span class="chip gold">体勢崩れ</span>`);
    if(B.focusT>0&&B.focus===e.id)ch.push('<span class="chip gold">集中攻撃</span>');
    if(B.selected===e.id)ch.push('<span class="chip gold">標的</span>');
    const cls=['u','en',e.state==='dead'?'dead':'',B.selected===e.id?'sel':'',e.wind>0?'wind':'',e.frozen>0?'frozen':''].join(' ');
    return `<div class="${cls}" data-id="${e.id}"><div class="un">${e.name}</div>
      <div class="bar hp"><i style="width:${e.hp/e.max*100}%"></i></div><div class="bar gauge"><i style="width:${e.gauge*100}%"></i></div>
      <div class="nums">${Math.ceil(e.hp)}/${e.max}</div><div class="chips">${ch.join('')}</div>${popHtml(e)}</div>`;}).join('');
  const L=getLeader();
  $('#party').innerHTML=B.units.map(u=>{
    const ch=[];
    if(u.state==='down')ch.push(`<span class="chip bad">瀕死 ${Math.max(0,u.down).toFixed(1)}</span>`);
    if(u.state==='lost')ch.push('<span class="chip bad">ロスト</span>');
    if(u.taunt>0)ch.push('<span class="chip gold">挑発</span>');
    if(u.parry>0)ch.push('<span class="chip frost">受け流し</span>');
    if(u.busy>0&&u.state==='ok')ch.push('<span class="chip good">行動中</span>');
    if(u.state==='ok'&&B.guardT>0)ch.push('<span class="chip frost">守り</span>');
    if(u.state==='ok'&&(S.spark[u.id]||0)>=60)ch.push('<span class="chip spark">兆し</span>');
    const cls=['u',u.state==='down'?'down':'',u.state==='lost'?'lost':'',L&&L.id===u.id?'leader':'',B.t-u.flashT<1.2?'flash':''].join(' ');
    return `<div class="${cls}"><div class="un"><span>${u.name} <small>${className(u.id)}${S.apostle===u.id?'・使徒':''}</small></span></div>
      <div class="bar hp"><i style="width:${u.hp/u.max*100}%"></i></div><div class="bar gauge"><i style="width:${u.state==='ok'?u.gauge*100:0}%"></i></div>
      <div class="nums">${Math.ceil(u.hp)}/${u.max}・信仰${Math.round(S.faith[u.id])}</div><div class="chips">${ch.join('')}</div>${popHtml(u)}</div>`;}).join('');
  $('#divbar').style.width=B.divine+'%';$('#divnum').textContent=Math.floor(B.divine);
  document.querySelectorAll('[data-o]').forEach(b=>{const o=ORACLES.find(x=>x.k===b.dataset.o);b.disabled=B.over||!!B.pending||B.divine<costOf(o);});
  $('#pending').textContent=B.pending?`神託「${ORACLES.find(o=>o.k===B.pending.k).w}」が${L?L.name:'リーダー'}に届くまで……`:'';
}
function popHtml(x){if(!x.pop||B.t-x.pop.t>0.7*B.speed)return '';return `<span class="pop ${x.pop.cls}">${x.pop.cls==='heal'?'+':''}${x.pop.v}</span>`;}

/* ============ 帰還 ============ */
function endBattle(kind){
  B.over=true; B.kind=kind; stopLoop();
  for(const u of B.units){
    if(u.state==='down'){if(kind==='wipe')loseUnit(u,true);else{u.state='ok';u.hp=1;}}
  }
  S.runs++; if(kind==='win')S.wins++;
  if(kind!=='wipe'){
    for(const u of B.units)if(u.state==='ok'){addFaith(u.id,kind==='win'?2:0);S.cruns[u.id]=(S.cruns[u.id]||0)+1;}
    relAfterRun(kind);
    for(const u of B.units){if(u.state!=='ok')continue;const id=u.id;const cur=S.cls[id]||CHAR_DB[id].role;let job=S.train[id]||cur;
      if(CLASSES[job]&&job!==cur)job=cur;
      S.jp[id]=S.jp[id]||{};S.jp[id][job]=(S.jp[id][job]||0)+(kind==='win'?2:1);
      for(const [k,a] of Object.entries(ABIL))if(a.job===job&&S.jp[id][job]>=a.jp&&!(S.abil[id]||[]).includes(k)){(S.abil[id]=S.abil[id]||[]).push(k);B.abLog.push(`${u.name}は${JOBNAME(job)}の修行で【${a.name}】を覚えた`);}}
    for(const u of B.units)if(u.state==='ok'&&!S.cls[u.id]){for(const [ck,c] of Object.entries(CLASSES))if(c.base===u.role&&c.ok(u.id))B.clsUnlock.push(`${u.name}は【${c.name}】に転職できる`);}
    // 師弟の伝授：師弟ともに生還した場合、1潜行ごとに進む
    for(const u of B.units){
      if(u.state!=='ok')continue;const m=S.master[u.id];if(!m)continue;
      const mu=B.units.find(x=>x.id===m);if(!mu||mu.state!=='ok')continue;
      const t=teachable(m,u.id);if(!t)continue;
      const cur=S.teach[u.id]&&S.teach[u.id].k===t.k?S.teach[u.id].p:0;
      if(cur+1>=2){const st=Math.max(1,t.st-1);learn(u.id,t.k,st,'teach');delete S.teach[u.id];B.teachLog.push(`${u.name}は師${mu.name}から【${SKILLS[t.k].name}】を授かった（${STAGE[st]}）`);}
      else{S.teach[u.id]={k:t.k,p:cur+1};B.teachLog.push(`${u.name}は師${mu.name}の【${SKILLS[t.k].name}】を見て学んでいる（${cur+1}/2）`);}
    }
    // 戦利品
    const cleared1=B.wave>1;const fl=B.floor||3;
    if((kind==='win'&&(!B.rivalAhead||Math.random()<.5))||(cleared1&&Math.random()<0.35)){const k=pick(LOOT);B.loot.push(addItem(S,k));}
    // 深い階ほど、装備がもう一つ見つかりやすく、書物も見つかりやすい
    if(kind==='win'&&Math.random()<0.12*(fl-3)){B.loot.push(addItem(S,pick(LOOT)));}
    if(kind==='win'&&Math.random()<Math.min(.9,(B.rivalAhead?0.25:0.5)+0.08*(fl-3))){const k=pick(BOOKS);S.books.push(k);B.loot.push('book:'+k);}
    if(kind==='win'&&S.next&&S.next.treasure&&!B.rivalAhead){const k=pick(BOOKS);S.books.push(k);B.loot.push('book:'+k);B.loot.push(addItem(S,pick(LOOT)));B.treasureFound=true;}
    for(const k of B.stolen)B.loot.push(addItem(S,k));
  }
  worldAfterRun(kind);
  persist(); render(); setTimeout(renderResult,900);
}
/* 旅から戻るたびに世界が動く：季節・年齢と隠居・町の信仰・大神の使徒・神威・信者・次の旅の噂 */
function worldAfterRun(kind){
  const notes=B.worldNotes=[];
  S.turn=(S.turn||0)+1;notes.push(`季節が巡った（${calTxt()}）`);
  if(S.turn%4===0){for(const id of Object.keys(CHAR_DB))if(avail(id))S.age[id]=ageOf(id)+1;notes.push('年が明け、皆ひとつ歳を重ねた');}
  if(B.treasureFound)notes.push('噂の書庫を見つけ、書物を持ち帰った');
  // 大迷宮：いちばん深い階で帰還すると、次の階が開く
  if(kind==='win'&&(B.floor||3)>=S.depth){S.depth=(B.floor||3)+1;S.floor=S.depth;notes.push(`${floorName(B.floor)}を踏破した。${floorName(S.depth)}への道が開けた`);}
  // 信仰と忠誠は、旅のたびに少しずつ本来の値へ戻る（放っておくと冷める）
  for(const id of Object.keys(CHAR_DB)){if(!avail(id))continue;
    const fb=CHAR_DB[id].faith,lb=LOYAL0[id]??60;
    if(S.faith[id]>fb)S.faith[id]-= (S.faith[id]-fb)*0.04;
    if(S.loyal[id]>lb)S.loyal[id]-=(S.loyal[id]-lb)*0.04;}
  // 町の信仰
  if(kind==='win'){const g=addBelief(BASE_TOWN,3);addBelief('rou',1);if(g)notes.push(`帰還の報せに、${TOWNS[BASE_TOWN].name}の人々があなたの名を口にした（信仰+${g}）`);}
  if(kind==='wipe'){const g=addBelief(BASE_TOWN,-5);if(g)notes.push(`一行が戻らず、${TOWNS[BASE_TOWN].name}の灯明がいくつか消えた（信仰${g}）`);}
  else if(B.lostNow.length){const g=addBelief(BASE_TOWN,-2);if(g)notes.push(`仲間を失った噂が広まった（${TOWNS[BASE_TOWN].name}の信仰${g}）`);}
  // 大神の使徒の一行
  const R=S.rival;
  if(B.rivalSaved){addBelief(BASE_TOWN,4);addBelief('liesen',2);R.fame=Math.max(0,R.fame-5);R.debt=(R.debt||0)+1;notes.push(`${R.name}の剣士を救った話が王都にまで届いた（ガルド+4・王都+2・使徒の名声-5）`);}
  if(S.next&&S.next.rival==='ahead'&&kind!=='win')R.fame+=2;
  R.fame=clamp(R.fame+Math.floor(rnd(1,4)),0,100);
  const t=pick(['liesen','liesen','seles','rou','nia',BASE_TOWN]);const loss=Math.max(1,Math.round(R.fame/25*(hasP('p2')?.5:1)));const lg=addBelief(t,-loss);
  if(lg)notes.push(`${R.name}が${TOWNS[t].name}で大神の教えを説いた（信仰${lg}）`);
  // 神威
  const gain=Math.floor(sumBelief()/60)+(kind==='win'?1:0)+(B.rivalSaved?1:0);
  S.divinity=(S.divinity||0)+gain;if(gain)notes.push(`町々の祈りが集まり、神威が${gain}増えた（いま${S.divinity}）`);
  // 信者が仲間に加わる
  const th=hasP('p3')?45:60;
  for(const [k,T] of Object.entries(TOWNS))if(!T.fixed&&S.belief[k]>=th&&!S.believers[k]){S.believers[k]=true;const id=makeChar({town:k});notes.push(`${T.name}から、信者の${CHAR_DB[id].name}（${ROLES[CHAR_DB[id].role]}）が神殿を訪ねてきた`);}
  // 隠居（年齢）
  for(const id of Object.keys(CHAR_DB))if(avail(id)&&ageOf(id)>=RETIRE_AGE)notes.push(retire(id,'age'));
  rollNext(S);
}
function relAfterRun(kind){
  const alive=B.units.filter(u=>u.state==='ok');const L=getLeader()||alive[0];
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){const a=alive[i],b=alive[j];const c=COMPAT[[a.pers,b.pers].sort().join('|')]||0;if(c)addRel(a.id,b.id,c);}
  for(const u of alive){const m=S.master[u.id];if(m&&alive.some(x=>x.id===m))addRel(u.id,m,2);}
  if(alive.length>=2)fireTalk(alive,7);
  for(const u of alive){
    for(const [k,v,d,msg] of (CREED[u.id]||[]))if(S.policy[k]===v){addLoyal(u.id,d);B.relNotes.push(`${u.name}「${msg}」（忠誠${d}）`);}
    if(L&&L!==u)addLoyal(u.id,clamp(Math.round(relOf(u.id,L.id)/20),-2,2));
    addLoyal(u.id,kind==='win'?1:0);
    if(B.lostNow.length)addLoyal(u.id,-3);
    // 倒れた恐怖と、撤退の悔しさは忠誠を削る
    if(u.downs){addLoyal(u.id,-2*u.downs);B.relNotes.push(`${u.name}は戦いの中で${u.downs}度倒れた（忠誠${-2*u.downs}）`);}
    if(kind==='retreat')addLoyal(u.id,-2);
  }
  for(const id of B.reclaimed){S.defected=S.defected.filter(x=>x!==id);delete S.contact[id];S.loyal[id]=50;S.faith[id]=Math.max(S.faith[id],30);
    const r=slotOf(CHAR_DB[id].role);const cur=S.party[r];S.party[r]=id;if(!S.equip[id])outfit(S,id);B.relNotes.push(`${CHAR_DB[id].name}が一行に戻った${cur?`（${CHAR_DB[cur].name}は控えに回った）`:''}`);}
  for(const u of alive){const id=u.id;if(B.reclaimed.includes(id))continue;
    const lo=S.loyal[id],fa=S.faith[id];
    if(S.contact[id]&&lo<35&&fa<35&&Math.random()<0.7){
      S.defected.push(id);delete S.contact[id];for(const r of ROLE_ORDER)if(S.party[r]===id){S.party[r]=null;S.vacated[r]=id;}
      const eq=S.equip[id]||{};for(const v of Object.values(eq))if(v)delete S.items[v];delete S.equip[id];
      for(const o of Object.keys(S.master))if(S.master[o]===id)delete S.master[o];delete S.master[id];
      if(S.apostle===id)S.apostle=null;
      B.relNotes.push(`！ ${u.name}は装備を持って姿を消した。大神の使徒の一行に加わったらしい`);B.defectNow=id;}
    else if(S.contact[id]&&(lo>=45||fa>=45)){delete S.contact[id];B.relNotes.push(`${u.name}は大神の使徒の誘いを断った`);}
    else if(!S.contact[id]&&lo<40&&fa<40){S.contact[id]=true;B.relNotes.push(`！ ${u.name}に大神の使徒が接触しているらしい`);}
  }
  S.grace=Math.min(graceMax(),(S.grace||0)+1);
}
function renderResult(){
  if(!B||!B.over||!$('#party'))return;
  setSteps('result');
  const kind=B.kind;
  const L=B.units.filter(u=>u.state==='ok').sort((a,b)=>(a.role==='sword'?-1:0)-(b.role==='sword'?-1:0)||S.faith[b.id]-S.faith[a.id])[0];
  const title={win:'帰還',retreat:'撤退',wipe:'全滅'}[kind];
  let h=`<div class="verdict ${kind}">${title}</div><p class="muted" style="margin:0">${B.place}${B.wave?`・第${B.wave}波`:''}・${fmt(B.t)}</p>`;
  if(kind==='wipe')h+=`<p class="report">誰も戻らなかった。装備も${B.wave?'迷宮':'荒野'}に呑まれた。神殿の灯明が、ひとつ、またひとつと消えていく。</p>`;
  else if(L)h+=`<p class="report"><b>${L.name}</b>「${REPORT[kind][L.pers]}${B.lostNow.length?` ……${B.lostNow.map(i=>CHAR_DB[i].name).join('と')}のことは、忘れない。`:''}」</p>`;
  const nm=id=>CHAR_DB[id].name;
  h+=`<div class="cols3"><section class="panel"><h3>仲間と信仰</h3><div class="tw"><table><thead><tr><th>名前</th><th>状態</th><th>信仰</th><th>増減</th></tr></thead><tbody>`;
  for(const u of B.units){const d=S.faith[u.id]-B.startFaith[u.id];
    h+=`<tr><td>${u.name}</td><td>${u.state==='lost'?'<span class="dn">ロスト</span>':'生還'}</td><td>${Math.round(S.faith[u.id])}</td><td class="${d>0?'up':d<0?'dn':''}">${d>0?'+':''}${Math.round(d)}</td></tr>`;}
  h+=`</tbody></table></div>`;
  h+=`<h3 style="margin-top:16px">連携技</h3><p style="font-size:.85rem;margin:0">成功 ${B.combos.ok}回・不完全 ${B.combos.fail}回</p>`;
  if(B.mast.length)h+=`<ul class="know">${B.mast.map(m=>`<li>【${COMBOS[m.c].name}】習熟 ${m.from}→${m.to}/4</li>`).join('')}</ul>`;
  {const rd=Object.entries(B.relDelta).filter(([k,v])=>Math.abs(v)>=4).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,6);
   h+=`<h3 style="margin-top:16px">人間関係</h3>`;
   if(B.relNotes.length)h+=`<ul class="know">${B.relNotes.map(x=>`<li class="${x.startsWith('！')?'dn':''}">${x}</li>`).join('')}</ul>`;
   if(rd.length)h+=`<ul class="know">${rd.map(([k,v])=>{const [a,b]=k.split('|');return `<li>${CHAR_DB[a].name}と${CHAR_DB[b].name} <span class="${v>0?'up':'dn'}">${v>0?'+':''}${v}</span></li>`;}).join('')}</ul>`;
   if(!B.relNotes.length&&!rd.length)h+='<p class="muted small">大きな変化はなかった。</p>';}
  if(B.disc.length)h+=`<h3 style="margin-top:12px">新たな神の知識</h3><ul class="know">${B.disc.map(k=>`<li>${KNOW[k].t}</li>`).join('')}</ul>`;
  h+=`</section><section class="panel"><h3>技と継承</h3>`;
  const anyGrow=B.flashes.length||B.ups.length||B.wills.length||B.teachLog.length||B.styleNew.length||Object.keys(B.styleUse).length||B.clsUnlock.length||B.abLog.length;
  if(!anyGrow)h+='<p class="muted small">今回、技に変化はなかった。強敵と戦うほど閃きやすく、神託の直後はさらに閃きやすい。</p>';
  if(B.flashes.length)h+=`<h4>閃き・開眼</h4><ul class="know">${B.flashes.map(f=>`<li>${nm(f.id)}：【${SKILLS[f.k].name}】${f.type==='eye'?'に開眼（体得）':'を閃いた（実戦）'}${f.grace?'<span class="muted">　神の気配の中で</span>':''}</li>`).join('')}</ul>`;
  if(B.ups.length)h+=`<h4>習熟</h4><ul class="know">${B.ups.map(x=>`<li>${nm(x.id)}：【${SKILLS[x.k].name}】${STAGE[x.st]}へ</li>`).join('')}</ul>`;
  if(B.wills.length)h+=`<h4>遺言</h4><ul class="know">${B.wills.map(w=>`<li>${nm(w.to)}が師${nm(w.from)}の【${SKILLS[w.k].name}】を継いだ（${STAGE[w.st]}）</li>`).join('')}</ul>`;
  if(B.styleNew.length||Object.keys(B.styleUse).length)h+=`<h4>流儀</h4><ul class="know">${B.styleNew.map(x=>`<li>${CHAR_DB[x.id].name}が流儀【${STYLES[x.k].name}】に目覚めた</li>`).join('')}${Object.entries(B.styleUse).map(([k,n])=>`<li>【${STYLES[k].name}】 ${n}回発動</li>`).join('')}</ul>`;
  if(B.abLog.length)h+=`<h4>アビリティ</h4><ul class="know">${B.abLog.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(B.clsUnlock.length)h+=`<h4>転職</h4><ul class="know">${B.clsUnlock.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(B.teachLog.length)h+=`<h4>師弟</h4><ul class="know">${B.teachLog.map(t=>`<li>${t}</li>`).join('')}</ul>`;
  h+=`</section><section class="panel"><h3>持ち帰ったもの</h3>`;
  if(!B.loot.length)h+='<p class="muted small">何も持ち帰れなかった。</p>';
  else h+=`<ul class="know">${B.loot.map(x=>x.startsWith('book:')?`<li>『${SKILLS[x.slice(5)].name}の書』</li>`:(S.items[x]?`<li>${itemDef(x).name}<span class="muted">（${itemDef(x).txt}）</span></li>`:'')).join('')}</ul>`;
  if(B.worldNotes&&B.worldNotes.length)h+=`<h3 style="margin-top:16px">世界の動き</h3><ul class="know">${B.worldNotes.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  h+=`<h3 style="margin-top:16px">神託の記録</h3>`;
  if(!B.oracles.length)h+='<p class="muted small">今回は一度も神託を下さなかった。パーティは戒律だけで戦った。</p>';
  else{h+=`<div class="tw"><table><thead><tr><th>時刻</th><th>神託</th><th>解釈</th><th>結果</th></tr></thead><tbody>`;
    for(const o of B.oracles)h+=`<tr><td>${fmt(o.t)}</td><td>${ORACLES.find(x=>x.k===o.k).w}</td><td>${o.leader}が${{obey:'従った',partial:'曲解した',ignore:'無視した'}[o.res]}</td><td>${o.note||'―'}</td></tr>`;
    h+=`</tbody></table></div>`;}
  h+=`</section></div><div class="cta" style="margin-top:22px"><button class="btn" id="back">神殿に戻る</button></div>`;
  $('#view').innerHTML=h; $('#back').onclick=renderPrep;
}

renderPrep();
</script>

<meta charset="utf-8">
<title>神託の迷宮 画面モック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: SNES解像度(256x224)の画面を等倍の整数倍で置き、その下に設計メモ。画面内のUIは1ドット単位(--px)で組む */
:root{
  color-scheme: dark;
  --page:#0b0d1e; --ink:#e8e6f4; --muted:#8f8cb0; --gold:#f2d06b; --line:#262a4e;
  --win-top:#4656b8; --win-bot:#141a66; --win-edge:#f4f4fa; --win-edge2:#8a8fb8;
  --hp:#f4f4fa; --warn:#ff8a6a; --heal:#7ef0a8; --spark:#fff27a;
  --f-dot:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);line-height:1.65}
.page{max-width:840px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1{font-family:var(--f-dot);font-weight:400;font-size:1.7rem;letter-spacing:.12em;margin:0;text-wrap:balance}
h1 span{color:var(--gold)}
.lead{color:var(--muted);font-size:.88rem;margin:4px 0 16px;max-width:68ch}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{font-family:var(--f-dot);font-size:1rem;letter-spacing:.1em;padding:6px 16px;color:var(--ink);cursor:pointer;
  background:linear-gradient(var(--win-top),var(--win-bot));border:2px solid var(--win-edge2);border-radius:4px}
.tabs button.on{border-color:var(--win-edge);box-shadow:0 0 0 2px var(--gold)}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.screen{position:relative;width:100%;max-width:768px;aspect-ratio:256/224;container-type:inline-size;background:#000;border-radius:4px;overflow:hidden;
  box-shadow:0 0 0 3px #000,0 0 0 5px var(--line)}
.screen #cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{position:absolute;inset:0;font-family:var(--f-dot);color:var(--hp);--px:calc(100cqw / 256);font-size:calc(var(--px) * 9);line-height:1.25;pointer-events:none}
.ui *{pointer-events:none}
.ui .click{pointer-events:auto;cursor:pointer}
.win{position:absolute;background:linear-gradient(var(--win-top),var(--win-bot));border:var(--px) solid var(--win-edge);border-radius:calc(var(--px)*3);
  box-shadow:inset 0 0 0 var(--px) var(--win-edge2);padding:calc(var(--px)*4) calc(var(--px)*6);text-shadow:var(--px) var(--px) 0 #000;overflow:hidden}
.row{display:flex;align-items:center;gap:calc(var(--px)*6);height:calc(var(--px)*13)}
.row .nm{width:calc(var(--px)*40)}
.row .hp{width:calc(var(--px)*50);text-align:right;font-variant-numeric:tabular-nums}
.row.low .hp{color:var(--gold)}
.atb{flex:1;height:calc(var(--px)*4);background:#05061a;border:var(--px) solid #c8c8d8;position:relative}
.atb i{position:absolute;inset:0 auto 0 0;background:#c8c8d8}
.atb.full i{background:var(--gold)}
.ehead{color:#c8c8e8}
.pop{position:absolute;font-size:calc(var(--px)*11);transform:translate(-50%,-50%);text-shadow:var(--px) var(--px) 0 #000,calc(var(--px)*-1) calc(var(--px)*-1) 0 #000,var(--px) calc(var(--px)*-1) 0 #000,calc(var(--px)*-1) var(--px) 0 #000;
  animation:bounce .9s steps(9) forwards;font-variant-numeric:tabular-nums}
.pop.heal{color:var(--heal)} .pop.crit{color:var(--gold);font-size:calc(var(--px)*13)} .pop.small{font-size:calc(var(--px)*9)}
@keyframes bounce{0%{margin-top:0}20%{margin-top:calc(var(--px)*-8)}40%{margin-top:0}55%{margin-top:calc(var(--px)*-3)}70%{margin-top:0}100%{margin-top:0;opacity:1}}
.skill{left:50%;transform:translateX(-50%);top:calc(var(--px)*4);white-space:nowrap;text-align:center}
.skill.warn{color:var(--warn)} .skill.gold{color:var(--gold)} .skill.spark{color:var(--spark)}
.speech{left:calc(var(--px)*8);right:calc(var(--px)*8);top:calc(var(--px)*24)}
.speech b{color:var(--gold);font-weight:400}
.cmd .it{display:flex;align-items:center;height:calc(var(--px)*11);gap:calc(var(--px)*3)}
.cmd .hand{width:calc(var(--px)*9);color:var(--ink)}
.cmd .it.dim{color:#8a8fb8}
.cmd .cost{margin-left:auto;color:#b8bce0;font-size:calc(var(--px)*8)}
.div{height:calc(var(--px)*4);background:#05061a;border:var(--px) solid #c8c8d8;position:relative;margin-top:calc(var(--px)*3)}
.div i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.tiny{font-size:calc(var(--px)*8);color:#c8cbe8}
.gold{color:var(--gold)} .warnc{color:var(--warn)} .healc{color:var(--heal)} .muted2{color:#9a9ec8}
/* 拠点メニュー */
.menu .mi{height:calc(var(--px)*15);display:flex;align-items:center;gap:calc(var(--px)*3)}
.menu .mi .hand{width:calc(var(--px)*9);visibility:hidden}
.menu .mi.on .hand{visibility:visible}
.list .r{display:grid;grid-template-columns:calc(var(--px)*16) calc(var(--px)*44) calc(var(--px)*30) 1fr;align-items:center;gap:calc(var(--px)*3);height:calc(var(--px)*23);line-height:1.1}
.list .r img{width:calc(var(--px)*16);height:calc(var(--px)*17);image-rendering:pixelated;object-fit:cover;object-position:top}
.tagw{font-size:calc(var(--px)*8);padding:0 calc(var(--px)*2);border:var(--px) solid currentColor;border-radius:calc(var(--px)*2);justify-self:start}
.bars{display:grid;grid-template-columns:auto 1fr;gap:0 calc(var(--px)*3);align-items:center;font-size:calc(var(--px)*6);line-height:1.05}
.mbar{height:calc(var(--px)*3);background:#05061a;position:relative}
.mbar i{position:absolute;inset:0 auto 0 0}
.sect{color:var(--gold);font-size:calc(var(--px)*8);margin:calc(var(--px)*2) 0}
.ledger{display:grid;grid-template-columns:1fr auto;gap:calc(var(--px)*1) calc(var(--px)*6);font-size:calc(var(--px)*8.5);font-variant-numeric:tabular-nums}
.ledger .t{border-top:var(--px) solid #c8c8d8;padding-top:calc(var(--px)*2)}
.notes{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.notes{grid-template-columns:minmax(0,1fr)}}
.note{background:#12152e;border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.note h3{font-family:var(--f-dot);font-weight:400;font-size:1rem;letter-spacing:.08em;margin:0 0 6px;color:var(--gold)}
.note ul{margin:0;padding-left:1.2em;font-size:.84rem;color:#cfcde4}
.note li{margin-bottom:4px}
.tryrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.82rem;color:var(--muted)}
.tryrow button{font-family:var(--f-dot);font-size:.95rem;padding:3px 12px;color:var(--ink);cursor:pointer;background:linear-gradient(var(--win-top),var(--win-bot));border:2px solid var(--win-edge2);border-radius:4px}
.tryrow button:hover{border-color:var(--win-edge)}
.banner{left:50%;top:38%;transform:translateX(-50%);font-size:calc(var(--px)*12);letter-spacing:.2em;padding:calc(var(--px)*5) calc(var(--px)*14);white-space:nowrap}
.bwin{transition:transform .35s steps(6)}
.bwin.out{transform:translateY(110%)}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bwin{transition:none}}
</style>

<div class="page">
  <h1><span>✶</span> 神託の迷宮　画面モック</h1>
  <p class="lead">SNES相当の256×224ドットで描いた見た目のイメージです。冒険画面は、歩く・戦う・また歩くが同じマップ上で切れ目なくつながる、クロノ・トリガー風のシームレス戦闘にしています。絵はすべてコードで描いた仮のドットです。</p>
  <div class="tabs" id="tabs"><button data-m="adv" class="on">冒険</button><button data-m="world">世界</button><button data-m="base">拠点</button><button data-m="skill">技能</button></div>
  <div class="screen" id="screen"><canvas id="cv" width="256" height="224"></canvas><div class="ui" id="ui"></div></div>
  <div class="tryrow" id="tryrow"></div>
  <div class="notes" id="notes"></div>
</div>

/* ===== 動き：絵を部位ごとに動かして作る（切り絵アニメ） =====

   lean：上半身の傾き（+で前へ。頭ほど大きくずれる）／lift：[後ろ足,前足]を何画素持ち上げるか／sink：肩を沈める画素 */
function heroFrames(R){

  const d=R.getContext('2d').getImageData(0,0,w,h).data;let sx=0,n=0;
  for(let y=h-8;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>0){sx+=x;n++;}
  const split=n?Math.round(sx/n):Math.round(w/2);

    const bw=Math.min(w,split+4);

    // 上半身：1行ずつ横にずらして傾ける。sink のぶん肩を沈める（縦に縮めて下に詰める）
    const top=sink,uh=hip-sink;
    for(let y=0;y<hip;y++){const s=Math.round(lean*(hip-y)/hip);const dy=top+Math.floor(y*uh/hip);x.drawImage(R,0,y,w,1,P+s,dy,w,1);}
    return c;};
  // 歩き：後ろ足を上げて前へ運ぶ → そろう → 前足を上げて運ぶ → そろう
  const f={walk:[mk({lean:1,lift:[5,0],step:[2,1]}),mk({}),mk({lean:1,lift:[0,5],step:[-1,2]}),mk({})],
    ready:[mk({}),mk({sink:1})],atk:mk({lean:5,lift:[3,0],step:[-2,2]}),hurt:mk({lean:-3,step:[-1,-1]})};
  f.W={walk:f.walk.map(c=>tint(c,'#ffffff',.85)),ready:f.ready.map(c=>tint(c,'#ffffff',.85)),atk:tint(f.atk,'#ffffff',.85),hurt:tint(f.hurt,'#ffffff',.85)};

function buildAdvMap(B){

  for(let y=0;y<MH;y++)for(let X=RIVER[0];X<RIVER[1];X++){const e=X<RIVER[0]+3||X>=RIVER[1]-3;px(x,X,y,e?'#6a6656':((X+y)%9===0?'#3a5478':'#2c4466'));}

const ICON_OF={temple:'temple',garde:'town',liesen:'capital',seles:'town',nia:'village',rou:'village',great:'gate',mine:'mine',abbey:'abbey',burnt:'burnt',ash:'tower'};
let WICON={};
function placeIcon(p,t){
  const X=p.x,Y=p.y;
  const ic=p.kind!=='area'&&WICON[ICON_OF[p.id]];
  if(ic){g.drawImage(ic,X-Math.round(ic.width/2),Y+7-ic.height);
    if(p.kind==='dungeon'&&Math.floor(t*2)%2){px(g,X,Y+2,'#ff5a4a');}
    if(p.base){const b=Math.floor(t*3)%2;const fy=Y+7-ic.height-8;rect(g,X-3,fy-b,7,5,'#f2d06b');rect(g,X-2,fy+1-b,5,3,'#16121f');px(g,X,fy+5-b,'#f2d06b');}
    return;}
  if(p.kind==='area'){rect(g,X-3,Y-3,7,7,'#16121f');rect(g,X-2,Y-2,5,5,'#b8a87a');px(g,X,Y,'#8a6a3a');
    if(p.enc&&Math.floor(t*2)%2){px(g,X+5,Y-6,'#ff5a4a');px(g,X+6,Y-5,'#ff5a4a');px(g,X+7,Y-4,'#ff5a4a');px(g,X+7,Y-6,'#ff5a4a');px(g,X+5,Y-4,'#ff5a4a');}}
  else if(p.kind==='dungeon'){rect(g,X-5,Y-4,11,9,'#16121f');rect(g,X-4,Y-3,9,8,'#6a6478');rect(g,X-2,Y,5,5,'#16121f');if(Math.floor(t*2)%2)px(g,X,Y+1,'#ff5a4a');}
  else if(p.kind==='temple'){rect(g,X-5,Y-1,11,7,'#16121f');rect(g,X-4,Y,9,5,'#e8e2c8');rect(g,X-6,Y-3,13,2,'#f2d06b');px(g,X,Y-6,'#f2d06b');px(g,X,Y-5,'#f2d06b');px(g,X-1,Y-5,'#f2d06b');px(g,X+1,Y-5,'#f2d06b');}
  else{const big=p.kind==='capital';const w=big?13:9;rect(g,X-Math.floor(w/2)-1,Y-3,w+2,9,'#16121f');rect(g,X-Math.floor(w/2),Y-2,w,7,big?'#d8d8e8':'#c89a6a');rect(g,X-Math.floor(w/2),Y-4,w,2,'#a83a2a');if(big){rect(g,X-1,Y-9,3,6,'#d8d8e8');px(g,X,Y-10,'#f2d06b');}rect(g,X-1,Y+1,2,3,'#16121f');}
  if(p.base){const b=Math.floor(t*3)%2;rect(g,X-3,Y-15-b,7,5,'#f2d06b');rect(g,X-2,Y-14-b,5,3,'#16121f');px(g,X,Y-10-b,'#f2d06b');}
}
function worldInit(){
  WD={sel:'a_north'};
  UI.innerHTML=`<div class="win" style="left:${pct(4,W)};top:${pct(4,H)};font-size:calc(var(--px)*7.5);padding:calc(var(--px)*2) calc(var(--px)*5)"><span class="gold">リーゼン王国 西部</span>　第14週・晩秋<br>拠点：鉱山町ガルド</div>
    <div class="win" style="right:${pct(4,W)};top:${pct(4,H)};font-size:calc(var(--px)*7);padding:calc(var(--px)*2) calc(var(--px)*5)"><div class="gold">地方</div>▶ 王国西部<br><span class="muted2">　東の中原</span><br><span class="muted2">　南洋の諸島（船）</span><br><span class="muted2">　北の凍土（未踏）</span></div>
    <div class="win" id="wInfo" style="right:${pct(4,W)};bottom:${pct(4,H)};width:${pct(118,W)};font-size:calc(var(--px)*7.5)"></div>
    <div class="win" style="left:${pct(4,W)};top:${pct(30,H)};font-size:calc(var(--px)*7);padding:calc(var(--px)*2) calc(var(--px)*5)"><span class="gold">旅程</span>　ガルド→岩の丘→北の街道→大迷宮<br>3日・野営2夜・食費 60銀</div>
    ${PLACES.map(p=>`<div class="click" data-pl="${p.id}" style="position:absolute;left:${pct(p.x-8,W)};top:${pct(p.y-8,H)};width:${pct(16,W)};height:${pct(16,H)}"></div>`).join('')}`;
  UI.querySelectorAll('[data-pl]').forEach(el=>el.onclick=()=>{WD.sel=el.dataset.pl;worldInfo();});
  worldInfo();
}
function worldInfo(){const p=PLACES.find(q=>q.id===WD.sel);
  const kind={area:'街道の区画',dungeon:'迷宮',temple:'神殿',town:'町',village:'村',capital:'王都'}[p.kind];
  $('#wInfo').innerHTML=`<div class="gold">${p.name}<span class="tiny muted2">　${kind}</span></div>${p.info.map(l=>`<div>${l}</div>`).join('')}${p.faith!=null?`<div style="display:flex;align-items:center;gap:calc(var(--px)*3);margin-top:calc(var(--px)*2)"><span class="tiny">信仰</span><span class="mbar" style="flex:1"><i style="width:${p.faith}%;background:#9ad8ff"></i></span><span class="tiny">${p.faith}</span></div>`:''}`;}
function worldFrame(t){
  rect(g,0,0,W,H,'#000');g.drawImage(worldBg,0,0);
  const pos=id=>{const p=PLACES.find(q=>q.id===id);return [p.x,p.y];};
  for(const [a,b] of ROADS){const [x1,y1]=pos(a),[x2,y2]=pos(b);const n=Math.hypot(x2-x1,y2-y1)/3;for(let i=0;i<=n;i++){if(i%2)continue;px(g,Math.round(x1+(x2-x1)*i/n),Math.round(y1+(y2-y1)*i/n),'#c8b88a');}}
  for(const p of PLACES)placeIcon(p,t);
  const sel=PLACES.find(q=>q.id===WD.sel);rect(g,sel.x-8,sel.y-8,16,1,'#ffffff');rect(g,sel.x-8,sel.y+7,16,1,'#ffffff');rect(g,sel.x-8,sel.y-8,1,16,'#ffffff');rect(g,sel.x+7,sel.y-8,1,16,'#ffffff');
  // 旅の一行：区画を順にたどる
  const segs=ROUTE.length-1;const k=(t%9)/9*segs;const si=Math.floor(k),f=k-si;const [x1,y1]=pos(ROUTE[si]),[x2,y2]=pos(ROUTE[si+1]);
  const xx=x1+(x2-x1)*f,yy=y1+(y2-y1)*f;
  {const s=CHARS.gareth.R;const hh=18,ww=Math.round(s.width*hh/s.height);g.drawImage(s,Math.round(xx)-Math.round(ww/2),Math.round(yy)-hh+3,ww,hh);}
  if(f>.45&&f<.6){const fl=Math.floor(t*8)%2;rect(g,Math.round(xx)+7,Math.round(yy)-2-fl,3,3,'#ff9a30');px(g,Math.round(xx)+8,Math.round(yy)-4,'#fff0a0');}
}

/* ================= 切り替え・ループ ================= */
const NOTES={

    ['地形が戦術になる',['戒律「狭い所で迎え撃つ」に従って、道の細い場所で戦いを始めている','凍結の霧は範囲（青い円）、貫通矢は直線。敵の並びで連携技の効き方が変わる','オーガの大技は地面に赤い円で予告される。円が満ちる前に神託を間に合わせる']]],
  base:[['拠点メニュー',['FF6のメニュー画面と同じ、右にコマンド・左に詳細の構成。右のコマンドはクリックで切り替えられる','編成：潜行5人と控えを入れ替える。疲労・忠誠・信仰の3本のゲージで状態を見る','収支：家賃と給金が毎週出ていく。控えを抱えすぎると家計が回らない']],
    ['人間関係と離反',['線の色が関係の良し悪し。金は信頼、赤い点線は反目','忠誠（仲間・リーダーへ）と信仰（あなたへ）は別の値。両方が低い者は離反の候補','このモックではケイが危険な状態。大神の使徒が接触しているという噂が出ている']]],
  world:[['広い世界',['世界はいくつもの「地方」に分かれ、この画面はそのひとつ（王国西部）。右上の一覧のように、中原・諸島・凍土が続く','町と迷宮のあいだは「区画」（菱形）でつながる。区画の一つひとつが、冒険画面のような歩けるマップ','赤い印の区画は敵が多い。旅程は通る区画の数で決まり、日数・食費・疲労に効く']],
    ['拠点選び',['拠点（家の印）はどの町にも置ける。迷宮に近い町ほど家賃が高い','町ごとに「あなたへの信仰」が育つ。高い町では神力が回復しやすく、信者が仲間に加わる','王都は大神の膝元。仲間も書物も多いが、あなたの神力は弱まる']]],
  skill:[['技の系譜と職',['右のコマンドで「系譜」「流儀」「職」を切り替える','系譜：線の色が覚え方（黄＝閃き、青＝書物・開眼、赤＝師弟）。？？？は未発見、暗い枠は上級職でしか閃けない技','職：上級職は技の体得・信仰・忠誠・町の師匠などが条件。転職しても技は残り、閃ける系譜が増える']],
    ['流儀（個人の相乗効果）',['技枠4つの組み合わせで「流儀」が発動する。持たせる技の組み合わせそのものが育成の目標になる','流儀は最初は伏せられていて、発動して初めて名前がわかる','連携技（複数人）と流儀（一人）の二層で、コンボを覚えさせる楽しさを作る']]],
};
function setMode(m){
  mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  start=performance.now();lastT=0;UI.innerHTML='';g.setTransform(1,0,0,1,0,0);A=null;
  if(m==='adv')advInit();if(m==='base'){rect(g,0,0,W,H,'#000');baseInit();}
  if(m==='world')worldInit();if(m==='skill'){rect(g,0,0,W,H,'#000');skillInit();}
  $('#notes').innerHTML=NOTES[m].map(([h,l])=>`<div class="note"><h3>${h}</h3><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  $('#tryrow').innerHTML=m==='adv'?'神託を試す：'+ORC.map(([w],i)=>`<button data-try="${i}">${w}</button>`).join(''):(m==='base'||m==='skill'?'右のコマンドをクリックすると中身が切り替わります。':m==='world'?'町・迷宮・区画をクリックすると詳細が出ます。':'');
  $('#tryrow').querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>tryOracle(+b.dataset.try));
}
function loop(now){
  const t=Math.max(0,(now-start)/1000);const dt=Math.min(.05,Math.max(0,t-lastT));lastT=t;
  if(mode==='adv'&&A)advFrame(t,dt);else if(mode==='world')worldFrame(t);
  raf=requestAnimationFrame(loop);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
Promise.all([loadHeroes(),loadBg(),loadEnemies(),loadWorld()]).then(()=>{setMode('adv');raf=requestAnimationFrame(loop);});
</script>
